<title>ナカカラモ（NAKAKARAMO）</title>
<style>
:root{
  --bg:#FAF9F6;--surface:#FFFFFF;--surface2:#F6F3EE;
  --ink:#1E2A23;--ink2:#46524B;--muted:#838B86;--line:#ECE7DF;--line2:#DDD6CA;
  --green:#5A8A69;--green-d:#3F6B4E;--green-s:#E4EDE5;--green-p:#F2F7F2;
  --beige:#E9DFCF;--beige-s:#F6F0E6;--gold:#A98B5E;
  --danger:#B25440;--danger-s:#F8E9E5;--warn:#A9782A;--warn-s:#F8F0E0;
  --radius:18px;--radius-s:12px;
  --shadow:0 1px 2px rgba(30,42,35,.04),0 8px 28px rgba(30,42,35,.05);
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Didot","Times New Roman",serif;
}
/* ---------- ダークモード（端末の設定に合わせる／設定画面で切り替え） ---------- */
:root[data-theme="dark"]{--bg:#121614;--surface:#1B201D;--surface2:#232925;
  --ink:#E6ECE7;--ink2:#BCC6BF;--muted:#8F9891;--line:#2C332E;--line2:#3B443D;
  --green:#7FB08E;--green-d:#5E9E72;--green-s:#26372B;--green-p:#1D2B21;
  --beige:#4A4232;--beige-s:#29251D;--gold:#C9A877;
  --danger:#E3907C;--danger-s:#3A2420;--warn:#D9A955;--warn-s:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);color-scheme:dark}
:root[data-theme="dark"] .topbar{background:#121614!important}
:root[data-theme="dark"] .bottom-nav{background:rgba(27,32,29,.96)!important;border-color:var(--line)!important}
:root[data-theme="dark"] .input,:root[data-theme="dark"] .select,:root[data-theme="dark"] .textarea,:root[data-theme="dark"] .checks .check,:root[data-theme="dark"] .used-list .check{background:var(--surface2);color:var(--ink)}
:root[data-theme="dark"] .field.has-error .input,:root[data-theme="dark"] .field.has-error .select,:root[data-theme="dark"] .field.has-error .textarea{background:#2A1D1A}
:root[data-theme="dark"] .notice{border-color:#3D3528;color:#E2D3B8}
:root[data-theme="dark"] .notice.green{border-color:#2F4535;color:#A9D3B4}
:root[data-theme="dark"] .notice.warn{border-color:#4D3D20;color:#EBCB8E}
:root[data-theme="dark"] .notice.red{border-color:#5A3229;color:#F0B4A5}
:root[data-theme="dark"] .chip.beige{color:#D9C29C}
:root[data-theme="dark"] .chip.gray{background:#2A302C;color:#AEB6B0}
:root[data-theme="dark"] .badge-sample{background:#3A3018;color:#EBCB8E;border-color:#5A4A22}
:root[data-theme="dark"] .badge-unverified{background:#2A2E2B;color:#B9B3A8;border-color:#3B403C}
:root[data-theme="dark"] .tab.active{color:var(--bg)}
:root[data-theme="dark"] .toast{background:#2A302C;color:#EEF1EE}
:root[data-theme="dark"] .toast-btn{color:var(--green-d)}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1C2620 0%,#262219 50%,#1C2620 100%);background-size:220% 220%}
:root[data-theme="dark"] .lock-card{background:linear-gradient(135deg,#221F18,#1E1C16)}
:root[data-theme="dark"] .offer.shop-card.selected{background:#3A3120;border-color:#C99B2E}
:root[data-theme="dark"] .ing-list a{border-color:#2F4535}
:root[data-theme="dark"] .btn-danger-ghost{border-color:#5A3229}
:root[data-theme="dark"] .modal-backdrop{background:rgba(0,0,0,.55)}
:root[data-theme="dark"] .ad-box{filter:brightness(.85)}
:root[data-theme="dark"] img.meal-thumb,:root[data-theme="dark"] .img-prev{filter:brightness(.92)}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){--bg:#121614;--surface:#1B201D;--surface2:#232925;
  --ink:#E6ECE7;--ink2:#BCC6BF;--muted:#8F9891;--line:#2C332E;--line2:#3B443D;
  --green:#7FB08E;--green-d:#5E9E72;--green-s:#26372B;--green-p:#1D2B21;
  --beige:#4A4232;--beige-s:#29251D;--gold:#C9A877;
  --danger:#E3907C;--danger-s:#3A2420;--warn:#D9A955;--warn-s:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);color-scheme:dark}
:root:not([data-theme="light"]) .topbar{background:#121614!important}
:root:not([data-theme="light"]) .bottom-nav{background:rgba(27,32,29,.96)!important;border-color:var(--line)!important}
:root:not([data-theme="light"]) .input,:root:not([data-theme="light"]) .select,:root:not([data-theme="light"]) .textarea,:root:not([data-theme="light"]) .checks .check,:root:not([data-theme="light"]) .used-list .check{background:var(--surface2);color:var(--ink)}
:root:not([data-theme="light"]) .field.has-error .input,:root:not([data-theme="light"]) .field.has-error .select,:root:not([data-theme="light"]) .field.has-error .textarea{background:#2A1D1A}
:root:not([data-theme="light"]) .notice{border-color:#3D3528;color:#E2D3B8}
:root:not([data-theme="light"]) .notice.green{border-color:#2F4535;color:#A9D3B4}
:root:not([data-theme="light"]) .notice.warn{border-color:#4D3D20;color:#EBCB8E}
:root:not([data-theme="light"]) .notice.red{border-color:#5A3229;color:#F0B4A5}
:root:not([data-theme="light"]) .chip.beige{color:#D9C29C}
:root:not([data-theme="light"]) .chip.gray{background:#2A302C;color:#AEB6B0}
:root:not([data-theme="light"]) .badge-sample{background:#3A3018;color:#EBCB8E;border-color:#5A4A22}
:root:not([data-theme="light"]) .badge-unverified{background:#2A2E2B;color:#B9B3A8;border-color:#3B403C}
:root:not([data-theme="light"]) .tab.active{color:var(--bg)}
:root:not([data-theme="light"]) .toast{background:#2A302C;color:#EEF1EE}
:root:not([data-theme="light"]) .toast-btn{color:var(--green-d)}
:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#1C2620 0%,#262219 50%,#1C2620 100%);background-size:220% 220%}
:root:not([data-theme="light"]) .lock-card{background:linear-gradient(135deg,#221F18,#1E1C16)}
:root:not([data-theme="light"]) .offer.shop-card.selected{background:#3A3120;border-color:#C99B2E}
:root:not([data-theme="light"]) .ing-list a{border-color:#2F4535}
:root:not([data-theme="light"]) .btn-danger-ghost{border-color:#5A3229}
:root:not([data-theme="light"]) .modal-backdrop{background:rgba(0,0,0,.55)}
:root:not([data-theme="light"]) .ad-box{filter:brightness(.85)}
:root:not([data-theme="light"]) img.meal-thumb,:root:not([data-theme="light"]) .img-prev{filter:brightness(.92)}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
/* 画面の上を下に引っぱったとき、「ナカカラモ」の上に背景のグラデーションが見えないように、上の帯と同じ色で埋める */
.topbar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:400px;background:inherit;pointer-events:none}
/* 下に引っぱって更新：ふつうのバウンドは止めて、上に出る部分は「ナカカラモ」の帯と同じ色にする */
html,body{overscroll-behavior-y:none}
#page{position:relative}
#page{will-change:auto}
.ptr{position:absolute;left:50%;bottom:calc(100% + 16px);width:30px;height:30px;margin-left:-15px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--green-d);opacity:0;pointer-events:none;transform-origin:50% 50%}
.ptr.fade{transition:opacity .22s ease,transform .22s ease;opacity:0!important;transform:scale(.5)}
.ptr svg{width:24px;height:24px}
.ptr.spin svg{animation:ptrSpin .7s linear infinite}
.ptr-arc{transition:none}
@keyframes ptrSpin{to{transform:rotate(360deg)}}
/* いちばん後ろの背景：おだやかな色のグラデーション（画面に固定して、スクロールしても動かない） */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(160deg,#F4F0E6 0%,#E9F0E6 45%,#F3E8DE 100%)}
/* 朝・昼・夜で背景の色を変える（少し濃いめ） */
html[data-tod="morning"] body::before{background:linear-gradient(160deg,#FCE6D2 0%,#F9EBD9 40%,#E3EEF4 100%)}
html[data-tod="day"] body::before{background:linear-gradient(160deg,#E2EFF6 0%,#E6F2E6 50%,#F5EFDD 100%)}
html[data-tod="night"] body::before{background:linear-gradient(160deg,#E4E1F2 0%,#E9E1EE 45%,#F2E3E3 100%)}
:root[data-theme="dark"] body::before{background:linear-gradient(160deg,#121614 0%,#151C18 50%,#1A1714 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{background:linear-gradient(160deg,#121614 0%,#151C18 50%,#1A1714 100%)}}
/* スマホでのガクガク対策：横に揺れない・ダブルタップで拡大しない・重いぼかし処理を使わない */
/* 横揺れ対策は、ページ全体ではなく中身の枠だけにかける（ページ全体にかけるとiPhoneでスクロールがガクガクするため） */
.app{overflow-x:hidden;overflow-x:clip;max-width:100%}
/* スマホ：画面は縦にだけ動かす（横に動かない）。2本指の拡大はできる */
body{touch-action:pan-y}
@media(max-width:639px){input,select,textarea,.input,.select,.textarea{font-size:16px!important}}
a,button,input,select,textarea,label,[data-action]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* アプリのように：文字や画像を長押ししても、選択・コピーのメニューが出ないようにする（入力欄は今までどおり選べる） */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable="true"],.selectable{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
@media(max-width:959px){
  .topbar{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--bg)!important}
  .bottom-nav{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--surface)!important}
  .hero::after{display:none}
}
body{margin:0;font-family:var(--font);background:transparent;color:var(--ink);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
#main{overflow-wrap:anywhere;word-break:normal}
#main .card,#main .offer,#main .offer-top>div{min-width:0}
body.no-scroll{position:fixed;left:0;right:0;overflow:hidden;width:100%}
a{color:var(--green-d)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.02em}
p{margin:0}
button{font-family:inherit}
[hidden]{display:none!important}

/* ---------- Layout ---------- */
.sidebar{display:none}
.topbar{position:relative;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));background:#FAF9F6;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--serif);font-size:20px;letter-spacing:.06em;color:var(--ink);text-decoration:none;font-weight:500}
.top-title{margin:0;font-size:21px;line-height:40px;padding:0;white-space:nowrap;font-family:var(--font);font-weight:600;letter-spacing:.02em;color:var(--ink)}
.tt-in{animation:none}
@keyframes ttIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.tt-in{animation:none}}
.topbar .wm-home{position:absolute;left:50%;top:calc(50% + env(safe-area-inset-top) / 2);transform:translate(-50%,-50%);font-family:var(--serif);font-weight:500;font-size:18px;letter-spacing:.06em;color:var(--ink);white-space:nowrap} /* ホームの「ナカカラモ」：丸みのある文字で、まん中に */
.topbar .wm-home.tt-in{animation:none}
.topbar .wm-wx{font-family:var(--font);letter-spacing:0;max-width:calc(100% - 24px)}
.twx{display:flex;align-items:center;gap:12px;background:none;border:0;padding:6px 4px;font:inherit;color:var(--ink);cursor:pointer;white-space:nowrap}
.twx svg{vertical-align:-1px;margin-right:3px;color:var(--green-d)}
.twx-pl{font-size:13px;font-weight:700;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.twx-n{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:3px}.twx-n small{font-size:10px;font-weight:500;color:var(--muted)}.twx-n.warn{color:var(--warn)}
.twx-load{font-size:13px;color:var(--muted);font-weight:500}
.twx-set{font-size:13px;font-weight:600;color:var(--green-d);padding:6px 12px;border-radius:999px;background:var(--green-l,#E5F2EA)}
@media(max-width:360px){.twx{gap:8px}.twx-n{font-size:13.5px}.twx-pl{max-width:56px}}
.topbar>#top-menu,.topbar>.hap-keep{margin-left:auto}
/* メニュー（三本線）はなくした。中の画面は、ホームの「ショートカット」からすべて開ける */
.topbar #top-menu,.topbar .hap-keep:has(#top-menu){display:none!important}
.topbar{min-height:calc(65px + env(safe-area-inset-top))} /* 上の帯の高さは、どの画面でも同じにする */
.wordmark small{display:block;font-family:var(--font);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:2px}
main{max-width:1100px;margin:0 auto;padding:20px 16px calc(150px + env(safe-area-inset-bottom))} /* 一番下にも余白：最後のカードが下のバーにくっつかないように */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:max(4px,calc(env(safe-area-inset-bottom) - 16px))} /* 下のバーを全体的に下げる（iPhoneの下の線の近くまで） */
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font-size:10.5px;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;min-width:0;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.bn-item span{max-width:100%;overflow:hidden;text-overflow:clip}
.bn-item svg{width:20px;height:20px}
.bn-item{font-weight:600}
.bn-item span{font-size:11px;font-weight:600;letter-spacing:0;line-height:1.25} /* 上のタブ（今日の記録・おすすめケア…）と同じ文字の感じにそろえる */
.bn-item.active{color:#E8781E} /* 選んでいる項目はオレンジ（光・太さ・大きさの変化はなし） */
.bn-item svg,.bn-item span{transition:transform .2s ease}
.bn-item.active svg{transform:none}
.bn-item.active span{transform:none} /* 文字は大きくしない（押したときに横にずれて見えないように） */
.bn-item svg{transform-origin:50% 50%}
.acc-list{padding:4px 0}
.acc-row{display:grid;grid-template-columns:22px 1fr 12px;align-items:center;gap:12px;padding:14px 18px;color:var(--ink);text-decoration:none}
.acc-row+.acc-row{border-top:1px solid var(--line)}
.acc-row svg{width:22px;height:22px;color:var(--green-d)}
.acc-row b{display:block;font-size:15px}
.acc-row small{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.acc-row i{font-style:normal;color:var(--muted);font-size:18px}
.sn-brand{padding:4px 12px 20px}
.sn-brand .wordmark{font-size:24px}
.sn-copy{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6}
.sn-group{font-size:10.5px;letter-spacing:.14em;color:var(--gold);font-weight:700;padding:14px 12px 4px}
.sn-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-size:14px;margin-bottom:1px;transition:background .15s}
.sn-item svg{width:19px;height:19px;flex:none}
.sn-item.active{background:var(--green-s);color:var(--green-d);font-weight:600}
.sn-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:16px 12px 0;line-height:1.6}
@media(min-width:960px){
  .app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
  .sidebar{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:28px 16px 20px;background:var(--surface);border-right:1px solid var(--line)}
  .topbar,.bottom-nav{display:none}
  main{padding:40px 44px 64px}
}

/* ---------- Common ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-head h1{font-size:24px}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:4px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:16px}
.card-h .link{font-size:13px;text-decoration:none;color:var(--green-d);white-space:nowrap}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;font-weight:600}
.grid{display:grid;gap:16px}
.grid > .card + .card{margin-top:0}
.mt{margin-top:16px}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .15s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--green-d);color:#fff}
.btn-ghost{background:var(--surface);border-color:var(--line2);color:var(--ink2)}
.btn-soft{background:var(--green-s);color:var(--green-d)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger-ghost{background:var(--surface);border-color:#E7C9C1;color:var(--danger)}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn:focus-visible,.input:focus-visible,.seg input:focus-visible + span{outline:3px solid #BFD6C5;outline-offset:2px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink2);font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.on{background:var(--green);color:#fff}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}
label.btn{position:relative}
/* 押した瞬間に反応が見えるように */
.btn:active,.bn-item:active,.ls-main:active,.acc-row:active,.mb-col:active,.tab:active,.icon-btn:active,.ac-item:active{opacity:.82}
/* ハンバーガー（三本線→×に変わる） */
.hb{position:relative;width:20px;height:14px;display:block}
.hb i{position:absolute;left:0;right:0;height:2px;border-radius:2px;background:currentColor;transition:transform .25s ease,opacity .2s ease,top .25s ease}
.hb i:nth-child(1){top:0}.hb i:nth-child(2){top:6px}.hb i:nth-child(3){top:12px}
#top-menu.x .hb i:nth-child(1){top:6px;transform:rotate(45deg)}
#top-menu.x .hb i:nth-child(2){opacity:0;transform:scaleX(.3)}
#top-menu.x .hb i:nth-child(3){top:6px;transform:rotate(-45deg)}
#top-menu.x{background:var(--surface)}
#drawer-root{position:fixed;inset:0;z-index:310;pointer-events:none}
#drawer-root.open{pointer-events:auto}
.drawer-bg{position:absolute;inset:0;background:rgba(20,24,22,.38);opacity:0;transition:opacity .25s ease}

@media(min-width:640px){.face-wrap{grid-template-columns:220px 1fr}}
.face{width:100%;max-width:220px;margin:0 auto;display:block;user-select:none;-webkit-user-select:none}

.face [data-area].on{fill:#C9DFCE;stroke:var(--green)}
.face text{font-size:11px;fill:#5E574C;pointer-events:none;font-family:var(--font)}

.f3-stage{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:1/1;border-radius:16px;background:transparent;overflow:hidden}

.f3-stage canvas:active{cursor:grabbing}
.f3-views{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.f3-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);padding:20px;text-align:center}
.f3-tip{position:absolute;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:4px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}
/* ホームの「今日の肌を記録・睡眠・運動・食事」：うしろの枠はなくして、ボタンは「化粧品を追加」と同じ大きさ */
.hero.hero-plain{background:none;border:0;padding:0;border-radius:0;animation:none;overflow:visible;box-shadow:none}
.hero.hero-plain::after{display:none}
.hero-plain .life-btns{max-width:none;margin-top:0;gap:10px}
.hero-plain .life-btns .btn-sm{min-height:44px;font-size:14px;background:var(--surface)} /* Myアイテムの「化粧品を追加」と同じ大きさ */
.hero-plain .life-btns .hap-keep{width:100%;display:block}
.hero-plain .life-btns .hap-keep>.btn{width:100%}
.life-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;max-width:420px}
.life-btns .btn{justify-content:center;padding-left:6px;padding-right:6px;white-space:nowrap}
.life-btns .life-main{grid-column:1 / -1;grid-row:1}
.life-btns>:not(.life-main){grid-row:2}
.life-links{display:inline-flex;gap:10px;margin-left:6px}
.life-sum{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.ls-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--surface2);font-size:13px}
.ls-head .link{background:none;border:0;padding:0;font-family:inherit;cursor:pointer;color:var(--green-d);text-decoration:underline}
.ls-row+.ls-row{border-top:1px solid var(--line)}
.ls-main{width:100%;display:grid;grid-template-columns:18px auto 1fr 10px;align-items:baseline;column-gap:8px;row-gap:2px;padding:10px 12px;border:0;background:none;color:var(--ink);font-family:inherit;text-align:left;cursor:pointer}
.ls-main svg{width:16px;height:16px;color:var(--green-d)}
.ls-l{font-size:12.5px;color:var(--muted)}
.ls-main b{font-size:15px;font-weight:700;white-space:nowrap}
.ls-main b.none{color:var(--muted);font-weight:500;font-size:13.5px}
.ls-main b{grid-column:3}
.ls-main em{grid-column:2 / span 2;grid-row:2;font-style:normal;font-size:13px;font-weight:600;color:var(--muted);min-width:0;line-height:1.45}
.ls-go{grid-column:4;grid-row:1 / span 2;align-self:center}
.ls-main svg{align-self:center}
.ls-head b{white-space:nowrap}.ls-head .link{white-space:nowrap}
.ls-main em small{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:2px}
.ls-main em.bad{color:#C0563B}
.ls-main em.good{color:var(--green-d)}
.ls-go{color:var(--muted);font-size:18px;line-height:1}
.advice{margin-top:12px}
/* 月々のスキンケア代（アカウント） */
.mb-card .card-h h2{display:flex;align-items:center;gap:8px}

.mb-col{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:0;cursor:pointer;font-family:inherit;color:var(--muted);min-width:0}

.mb-v{font-size:11px;white-space:nowrap;letter-spacing:-.02em}

.mb-sum{margin-top:14px;background:var(--surface2);border-radius:14px;padding:14px}
.mb-total{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

.mb-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}

.mb-chip.good{color:#2F7A4A;background:#E5F4E4}
.mb-chip.bad{color:#C0563B;background:#FBEBEB}

:root[data-theme="dark"] .mb-chip.bad{background:rgba(220,90,70,.18);color:#F0A08C}
.mb-cats{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.mb-cat{display:grid;grid-template-columns:minmax(0,6.5em) 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.mb-cat span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}

.mb-catbar i{display:block;height:100%;background:var(--green);border-radius:99px;transform-origin:left;animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both}
.mb-list{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}

.mb-list li span{min-width:0}
.mb-list b{display:block;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.mb-list small{font-size:11.5px;color:var(--muted)}
.mb-list em{font-style:normal;font-weight:700;white-space:nowrap}
.mb-flash{animation:itemIn .35s ease both}
.mb-edit{border:1px dashed var(--line2);background:var(--surface);color:var(--green-d);font-family:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}

.mb-bform{margin-top:10px;background:var(--surface);border-radius:12px;padding:10px 12px;animation:itemIn .3s ease both}
.mb-brow{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.mb-brow .input{flex:1 1 110px;min-width:0;min-height:40px;font-size:16px;padding:6px 10px}
/* お気に入り */
.pcard{position:relative}
.fav-heart{position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#9A9590}
.fav-heart svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2}
.fav-heart.on{color:#E0566B}

.fav-btn.on{color:#C8405A;border-color:#F2C4CC}

.pcard.fav-out{opacity:0;transform:scale(.96);transition:opacity .25s ease,transform .25s ease}
.tabs .tab svg{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
/* アカウント：支出を押すと開く */
.acc-toggle{width:100%;border:0;background:none;font-family:inherit;text-align:left;cursor:pointer}

.acc-sec{padding:0;overflow:hidden;margin-bottom:12px}

.sc-edit{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--green-d);font-family:inherit;cursor:pointer;text-decoration:underline}

.acc-panel details.set-fold{border:0;padding:0;background:transparent}

.acc-panel .mb-card .card-h{margin-top:14px}

.mn-pick.reco-cap{margin:0 0 6px;flex-wrap:wrap;overflow:visible}

.credit{margin-top:4px;font-size:10.5px}

.home-pane.hp-in{animation:hpIn .46s cubic-bezier(.22,.7,.2,1)}

@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.fade-once{animation:fadeOnce .7s ease both}

@keyframes ktIn{to{opacity:1;transform:none;filter:none}}
.rv{opacity:0;transform:translateY(16px)}
.rv.in{opacity:1;transform:none;transition:opacity .55s ease var(--d,0ms),transform .6s cubic-bezier(.2,.8,.2,1) var(--d,0ms)}
.rv.in .bar i,.rv.in .budget-bar i{transform-origin:left center;animation:barGrow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0ms) + .15s)}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rv.in .ls-row,.rv.in .advice li,.rv.in .acc-row,.rv.in .life-btns>*,.rv.in .ld-nums>span{animation:itemIn .5s cubic-bezier(.2,.8,.2,1) both}
.rv.in .ls-row:nth-child(2),.rv.in .advice li:nth-child(1),.rv.in .acc-row:nth-child(1){animation-delay:.12s}
.rv.in .ls-row:nth-child(3),.rv.in .advice li:nth-child(2),.rv.in .acc-row:nth-child(2){animation-delay:.2s}
.rv.in .ls-row:nth-child(4),.rv.in .advice li:nth-child(3),.rv.in .acc-row:nth-child(3){animation-delay:.28s}
.rv.in .advice li:nth-child(4){animation-delay:.36s}
.rv.in .pgrid>*,.rv.in .mlist>*,.rv.in .shortcuts>*,.rv.in .stat-row>*,.rv.in.mrows>.mrow{animation:itemIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--si,0) * 55ms + 80ms)}
@keyframes itemIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chart.play path.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:lnDraw 1.2s cubic-bezier(.4,0,.2,1) .2s forwards}
@keyframes lnDraw{to{stroke-dashoffset:0}}
.chart.play circle.pt{opacity:0;transform-box:fill-box;transform-origin:center;animation:ptPop .4s cubic-bezier(.2,.9,.3,1.4) forwards;animation-delay:calc(var(--i) * 45ms + .35s)}
@keyframes ptPop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.chart.play rect.br{transform-box:fill-box;transform-origin:center bottom;animation:brGrow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 60ms + .15s)}
@keyframes brGrow{from{transform:scaleY(0)}to{transform:none}}
.btn,.bn-item,.ls-main,.acc-row,.ac-item,.tab{transition:transform .15s ease,background-color .2s ease,color .2s ease}
.btn:active,.ls-main:active,.acc-row:active,.tab:active{transform:scale(.97)}
.bn-item:active svg{transform:scale(.88)}
.bn-item.active svg{animation:none}

@media (prefers-reduced-motion:reduce){#main.pg-in,.fade-once,.kt,.rv,.rv.in,.rv.in *,.chart.play *,.bn-item.active svg{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;filter:none!important}}
/* 画面を切り替えたときの動き（ふわっと出る・順番に出る・グラフが伸びる）は、毎回だとうるさいので出さない */

.sw-opts > .hap-keep > .sw-opt,.sw-opts > .sw-opt{width:100%;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sw-opt small{display:block;font-size:11.5px;font-weight:500;opacity:.75;margin-top:2px}
.ld-arrow[hidden]{display:flex!important;visibility:hidden}
.sw-nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw-nums label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.sw-nums .unit{display:flex;align-items:center;gap:6px}
.sw-err{color:var(--danger);font-size:12.5px;text-align:center;margin:10px 0 0}
.sw-sec{font-size:13px;font-weight:700;margin:16px 0 8px}
.sw-list{margin:0 0 14px;padding-left:1.2em;font-size:12.5px;color:var(--ink2);line-height:1.6}
.sw-list li+li{margin-top:4px}
.sw-hello{text-align:center;font-size:40px;margin:4px 0 8px}
.sw-auth{display:flex;flex-direction:column;gap:6px;text-align:left}
.sw-auth .lbl{margin:6px 0 0}
.sw-auth .check{margin-top:6px;align-items:flex-start}
.sw-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.sw-seg .seg-opt{border:1px solid var(--line2);background:var(--surface);border-radius:999px;min-height:38px;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink2);cursor:pointer}
.sw-seg .seg-opt.on{background:var(--green-d);border-color:var(--green-d);color:#fff}
.sw-auth-go{margin-top:10px;width:100%}
.sw-auth-msg{margin:6px 0 0;color:var(--green-d);line-height:1.6}
.sw-foot{display:flex;gap:8px;width:100%}
.sw-foot .btn{flex:1}
.sw-foot>.hap-keep{flex:1 1 0;min-width:0;display:flex}
.sw-foot>.hap-keep>.btn{width:100%}
:root[data-theme="dark"] .ld-stage{background:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ld-stage{background:transparent}}
.ld-card{touch-action:pan-y;position:relative}
.ld-card .ld-top{position:absolute;top:10px;left:10px;right:auto;margin:0;z-index:6}
.ld-card .ld-cal{left:0;right:auto}
/* 3Dの顔は、顔とそのまわり少しだけを触れる大きさにする（その外では、ふつうにページをスクロールできる） */
.ld-card .ld-stage{max-width:240px;width:100%;aspect-ratio:auto;height:190px;margin:0 auto}
.ld-swipe{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:6px;margin-top:8px;user-select:none;-webkit-user-select:none}
.ld-arrow[hidden]{display:block;visibility:hidden}
.ld-arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ld-arrow svg{display:block;flex:none}
.ld-info{text-align:center;min-width:0}
.ld-date{display:flex;flex-direction:column;align-items:center;line-height:1.4}
.ld-sleep{text-align:center;margin-top:2px}
.ld-used{margin-top:12px}
.ld-used .used-sub{display:none}
.ld-date b{font-size:17px;white-space:nowrap}
.ld-nums{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.ld-nums b{color:var(--ink);font-size:14px}
.ld-detail{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.ld-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.ld-flash{animation:ldf .25s ease}
@keyframes ldf{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:none}}
:root[data-theme="dark"] .t3-stage{background:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t3-stage{background:transparent}}
.f3-tags{position:absolute;left:8px;top:8px;right:52px;z-index:2;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none}
.f3-tags span{font-size:12px;line-height:1.4;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid var(--line2);box-shadow:var(--shadow);white-space:nowrap}
.f3-tags .t-cond{color:#fff;border-color:transparent}
.t3-side{display:flex;flex-direction:column;gap:6px;min-width:0}
.t3-tags{display:flex;flex-wrap:wrap;gap:3px}
.t3-tags span{font-size:12.5px;line-height:1.5;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.t3-tags .t-cond{color:#fff}
.t3-acne{margin:2px 0 4px;font-size:12.5px;color:var(--muted)}
.t3-acne b{font-size:18px;color:var(--ink);margin:0 2px}
.t3-m{display:grid;grid-template-columns:2.6em 1fr 1.2em;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.t3-m .bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;display:block}
.t3-m .bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.t3-m b{color:var(--ink);font-weight:600;text-align:right}
@media(min-width:640px){.t3-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px}}
.f3-ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.f3-week{display:flex;flex-direction:column;align-items:center;line-height:1.4}
.f3-range{width:100%;margin-top:8px;accent-color:var(--green-d)}
.face-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.face-pair h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.photo-prev{display:flex;gap:12px;align-items:center;margin-top:10px}
.photo-prev img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.img-prev{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;margin-top:8px}
details.fold{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
details.fold summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink2)}
details.fold[open] summary{margin-bottom:10px}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(30,36,32,.38);display:flex;align-items:flex-end;justify-content:center;animation:bgIn .15s}
.modal{background:var(--surface);width:100%;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:sheetUp .26s cubic-bezier(.22,1,.36,1);box-shadow:0 -10px 40px rgba(0,0,0,.12);will-change:transform;position:relative}
/* 下から出てくるときに、シートの下にすき間（暗い色）が見えないように、シートの色を下へのばしておく */
.modal::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:var(--surface);pointer-events:none}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
/* 閉じるときは、後ろの暗い色だけを薄くする（シート自体はフェードさせず、下にすべらせるだけ） */
.modal-backdrop.closing{background:transparent!important;transition:background-color .17s ease}
@keyframes bgIn{from{background-color:transparent}}
.sheet-grab{display:flex;justify-content:center;padding:8px 0 0;cursor:grab;touch-action:none}
.sheet-grab i{width:40px;height:5px;border-radius:99px;background:var(--line2)}
.modal-head{touch-action:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:17px}
.modal-body{padding:20px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.modal-body .field,.modal-body .form-grid>*{min-width:0}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.modal-foot .btn{flex:1}
/* 対になったボタン（キャンセルと保存など）は、同じ幅・同じ高さにそろえる */
.modal-foot,.sw-foot,.btn-pair{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.modal-foot>*,.sw-foot>*,.btn-pair>*{min-width:0!important;width:auto!important}
.modal-foot>[hidden],.sw-foot>[hidden],.btn-pair>[hidden]{display:none!important}
.modal-foot>.hap-wrap>.btn,.modal-foot>.hap-keep>.btn,.sw-foot>.hap-wrap>.btn,.sw-foot>.hap-keep>.btn,.btn-pair>.hap-wrap>.btn,.btn-pair>.hap-keep>.btn{width:100%!important}
.modal-foot .btn,.sw-foot .btn,.btn-pair .btn{justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-pair{display:flex;gap:8px;align-items:stretch}
.page-actions:not(:has(>:nth-child(3))):has(>:nth-child(2)),.ext-links:not(:has(>:nth-child(3))):has(>:nth-child(2)){display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.page-actions:not(:has(>:nth-child(3))):has(>:nth-child(2))>*,.ext-links:not(:has(>:nth-child(3))):has(>:nth-child(2))>*{min-width:0;justify-content:center}
@media(min-width:640px){.modal-foot{grid-auto-columns:minmax(150px,max-content);justify-content:end}}
@media(min-width:640px){.sheet-grab{display:none}.modal-head{touch-action:auto}.modal{animation:up .2s ease-out}.modal::after{display:none}.modal-backdrop{align-items:center;padding:24px}.modal{max-width:660px;border-radius:22px;max-height:88vh}.modal.small{max-width:440px}.modal-foot .btn{flex:none}.modal-foot{padding-bottom:14px}}
.confirm-title{font-size:16px;margin-bottom:8px}
.confirm-msg{white-space:pre-line;font-size:14px;color:var(--ink2)}
.menu-list .grp{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:700;margin:14px 0 2px}
.menu-list a{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:15px}
.menu-list a svg{width:21px;height:21px;color:var(--green)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.toast{transition:opacity .35s ease,transform .35s ease}
.toast.out{opacity:0;transform:translateY(8px)}

/* ---------- Toast ---------- */
#toast-root{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:max-content;max-width:92vw}
@media(min-width:960px){#toast-root{bottom:28px}}
input[type="date"].input,input[type="time"].input{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;display:block;text-align:left;font-size:16px}
input[type="date"].input::-webkit-date-and-time-value,input[type="time"].input::-webkit-date-and-time-value{text-align:left}
.remind-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.time-pick{display:inline-flex;align-items:center;gap:6px;flex:none}
.time-pick .select{width:76px;min-width:0;padding:8px 10px;text-align:center}
.time-pick b{font-weight:600;font-size:14px}
.toast.undo{display:flex;align-items:center;gap:14px;pointer-events:auto}
.toast-btn{background:none;border:0;color:var(--green-d);font-weight:700;font-size:13.5px;cursor:pointer;padding:4px 2px;font-family:inherit}
.toast{background:#fff;color:#1E2320;padding:12px 20px;border-radius:999px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.05);animation:up .2s}
.toast.error{background:#fff;color:#B4412E;box-shadow:0 10px 30px rgba(0,0,0,.16),0 0 0 1px rgba(180,65,46,.35)}
.toast.undo{border-radius:999px}

/* ---------- Charts / tables ---------- */
.chart{width:100%;min-height:60px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:#EEEAE3;stroke-width:1}
.chart .ax{font-size:11px;fill:#8F968F;font-family:var(--font)}
.chart .rowlbl{font-size:11.5px;fill:#46524B;font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week-strip .d{background:var(--surface2);border-radius:12px;padding:8px 2px;font-size:11.5px;color:var(--muted)}
.week-strip .dot{width:22px;height:22px;border-radius:50%;margin:4px auto 0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.week-strip .dot.none{background:transparent;border:1.5px dashed var(--line2);color:var(--muted)}
.delta{font-size:12px;font-weight:600;color:var(--muted)}
.delta.good{color:var(--green-d)}
.delta.bad{color:var(--danger)}
.hbar{display:grid;grid-template-columns:110px 1fr 80px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.hbar .bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#8DB295);border-radius:99px}
.hbar .v{text-align:right;font-weight:600}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.table td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.table .r{text-align:right;white-space:nowrap}
.table-wrap{overflow-x:auto}
.points li{margin-bottom:10px;font-size:14px;line-height:1.7}
.points{padding-left:20px;margin:0}
.legal{font-size:14px;line-height:1.85}
.legal h3{font-size:15px;margin:22px 0 8px}
.legal h3:first-of-type{margin-top:14px}
.legal ol{padding-left:22px;margin:0}
.legal li+li{margin-top:4px}
.legal p{margin:0 0 8px}
.legal .table-wrap{overflow-x:auto;margin:8px 0}
.legal-table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.legal-table th,.legal-table td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
.legal-table th{background:var(--surface-2,rgba(0,0,0,.03))}
.legal-kv dd{line-height:1.7}
.nav-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.map-frame{width:100%;height:260px;border:0;border-radius:12px;background:var(--surface2);display:block}
.store-map{width:100%;height:340px;border-radius:12px;background:var(--surface2);overflow:hidden;position:relative;z-index:0}
.map-tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.map-legend{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 0;font-size:12px;color:var(--muted)}
.map-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.store-pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.store-pin b{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700;font-family:var(--font)}
.maplibregl-popup-content{font-family:var(--font);font-size:13px;line-height:1.5;padding:10px 12px;border-radius:10px}
.maplibregl-popup-content a{color:var(--green-d)}
.pin-wrap{width:34px;height:36px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.center-dot{width:14px;height:14px;border-radius:50%;background:#2B6CB0;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 0 8px rgba(43,108,176,.18)}
.offer.shop-card{cursor:pointer;transition:background .2s,box-shadow .2s,border-color .2s}
.offer.shop-card.selected{background:#FFF8E6;border-color:#E2B23A;box-shadow:0 0 0 3px rgba(226,178,58,.35)}
.store-pin.sel{width:34px;height:34px;margin-bottom:-2px;box-shadow:0 0 0 4px rgba(226,178,58,.6),0 2px 6px rgba(0,0,0,.4)}
.store-pin.sel b{font-size:13px}
.meal-block{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.meal-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meal-head label.btn{margin-left:0}
/* 食事の枠：長い食品名でもはみ出さない */
.meal-block{min-width:0;overflow-wrap:anywhere}
.meal-block .chip{white-space:normal;max-width:100%;line-height:1.5;padding:3px 10px}
.meal-block .check{max-width:100%;min-width:0}
.meal-block .check>span{min-width:0;overflow-wrap:anywhere}
.meal-block .notice{overflow-wrap:anywhere}
.photo-prev{flex-wrap:wrap}
.photo-prev>div{min-width:0;flex:1 1 160px}
.meal-block .btn{white-space:normal;max-width:100%;text-align:left}
.meal-block .chip .muted{white-space:nowrap}
.meal-block .photo-prev img{width:96px;height:96px}
.food-pick{display:grid;grid-template-columns:minmax(0,1fr) 104px auto;gap:6px;margin-top:8px;align-items:center}
.food-pick .select,.food-pick .input{min-height:40px;font-size:16px;padding:6px 10px;min-width:0}
.food-pick .select{padding-right:30px;background-position:right 10px center}
@media(max-width:420px){.food-pick{grid-template-columns:1fr 1fr}.food-pick > :first-child{grid-column:1/-1}}
.btn.has-prem,.mpt-locked,.tab:has(.prem-sub){flex-direction:column;gap:0;line-height:1.25}
.add-opt b .prem-sub{display:table;margin-top:3px}
.badge-premium,.prem-sub{display:inline-block;padding:1px 8px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap;
  background:linear-gradient(135deg,#F3E7CF,#E9D6B0);color:#7A5A22;border:1px solid #E2CDA2}
.prem-sub{font-size:10px;line-height:1.35;padding:0 7px;margin-top:3px}
.tab .prem-sub{display:table;margin:2px auto 0}
.plan-table td,.plan-table th{text-align:center}.plan-table td:first-child,.plan-table th:first-child{text-align:left}
.ad-box{margin-top:16px;border:1px dashed var(--line2);border-radius:var(--radius-s);padding:10px 12px;background:var(--surface)}
.ad-label{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.ad-ph{min-height:90px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--surface2);color:var(--muted);font-size:12.5px;text-align:center;padding:8px}
.lock-card{border-style:dashed;background:linear-gradient(135deg,#FFFDF8,#FBF5EA)}
.tab .badge-premium{margin-left:4px;font-size:10px;padding:0 5px}
.map-table td,.map-table th{text-align:center;white-space:nowrap}.map-table td:first-child,.map-table th:first-child{text-align:left;white-space:normal}
@media print{.sidebar,.topbar,.bottom-nav,#toast-root,.no-print,.back{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card{box-shadow:none;break-inside:avoid;border-color:#ccc}textarea{border:1px solid #ccc}}
.chip-x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 0 0 6px}
.meal-thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}

/* マウスがある端末だけ、ホバーで色を変える（スマホで「2回押さないと反応しない」ことを防ぐ） */
@media (hover:hover){:root[data-theme="dark"] .btn-primary:hover{background:#4C8660}:root:not([data-theme="light"]) .btn-primary:hover{background:#4C8660}.sn-item:hover{background:var(--surface2)}.btn-primary:hover{background:#355C42}.btn-ghost:hover{background:var(--surface2)}.back:hover{color:var(--ink)}.shortcut:hover{border-color:var(--green);background:var(--green-p)}.ac-item.on,.ac-item:hover{background:var(--surface2)}.pcard:hover{transform:translateY(-2px);border-color:var(--line2)}.mitem:hover{border-color:var(--line2)}.face [data-area]:hover{fill:#EAF1EA}}

  <div id="page">

function offerTotal(o) {

  if (o.shipping == null) return null;

}
function offerIssues(o, p) {
  const out = [];
  if (!o.same) out.push('同一商品か未確認（容量違い・セット・旧パッケージ等の可能性）');
  const pv = parseVol(p.volume), ov = parseVol(o.volume);
  if (pv && ov && (pv.unit !== ov.unit || Math.abs(pv.amt - ov.amt) > 0.01)) out.push(`内容量が異なる（商品：${p.volume}／この販売先：${o.volume}）`);
  if (o.kind === 'online' && o.shipping == null) out.push('送料未確認のため合計を出せません');
  return out;
}

const PRICE_SHIP = {included:'送料込み', conditional:'条件付き送料無料', extra:'送料別'};
async function priceSearch(pid, quiet) {
  const p = getCat(pid); if (!p) return;
  const st = ui.priceRes[pid] = {loading:true, items:[], errors:[], msg:''};
  if (!quiet) render();
  try {
    const ctrl = new AbortController(), tm = setTimeout(() => ctrl.abort(), 30000); // 30秒で打ち切る（「調べています」のまま止まらないように）
    const res = await fetch(CLOUD.url + '/functions/v1/prices', {method:'POST', signal:ctrl.signal, headers:{'Content-Type':'application/json', apikey:CLOUD.key},
      body:JSON.stringify({q:`${p.brand} ${p.name}`.replace(/【サンプル】/g, '').trim(), jan:p.jan || ''})});
    const j = await res.json().catch(() => ({})); clearTimeout(tm);
    if (!res.ok || j.error) throw new Error(j.error || '価格を調べられませんでした。');
    st.items = Array.isArray(j.items) ? j.items : []; st.errors = Array.isArray(j.errors) ? j.errors : []; st.at = j.fetchedAt || '';
  } catch (e) {
    st.msg = e && e.name === 'AbortError' ? '時間がかかりすぎたため中止しました。もう一度お試しください。' : /fetch|network|Failed/i.test(String(e && e.message)) ? 'サーバーに接続できませんでした。インターネットの接続を確認して、もう一度お試しください。' : String((e && e.message) || e);
  }
  st.loading = false;
  if (location.hash.startsWith('#/prices/') || location.hash.startsWith('#/cart') || location.hash.startsWith('#/product/' + encodeURIComponent(pid))) render();
}
// ミニ・セット・お試し・詰め替えなど、元の商品と違う可能性が高いものを見分ける（元の商品名に含まれる言葉は対象外）
const PRICE_SET_WORDS = [['セット', /セット/], ['ミニ', /ミニ|mini/i], ['お試し', /お試し|トライアル|サンプル|試供/], ['まとめ買い', /まとめ買い|(\d+)\s*(個|本|点|袋)\s*(セット|組)|[×x✕]\s*\d+\s*(個|本|袋)?(?!\s*(ml|g))/i], ['詰め替え', /詰め?替え?|つめかえ|レフィル|refill/i]];
function priceSetWord(name, base) {
  const n = toHalf(name), b = toHalf(base);
  const hit = PRICE_SET_WORDS.find(([, re]) => re.test(n) && !re.test(b));
  return hit ? hit[0] : '';
}
// 商品名に書かれた容量と、登録した容量を比べる。'same'：一致／'diff'：違う／''：商品名に容量が書かれていない
function priceVolMatch(name, vol) {
  const v = parseVol(vol); if (!v) return '';
  const found = [...toHalf(name).toLowerCase().matchAll(/(\d+(?:\.\d+)?)\s*(ml|g|枚)(?![a-z])/g)].map(m => ({amt:parseFloat(m[1]), unit:m[2]}));
  if (!found.length) return '';
  return found.some(f => f.unit === v.unit && Math.abs(f.amt - v.amt) < 0.01) ? 'same' : 'diff';
}

          <div class="chips" style="margin-top:10px;gap:14px">

async function overpassOnce(url, q, ms) {

    if (e && e.name === 'TypeError') throw new Error('busy'); // 混雑時は応答に許可の情報が付かず、通信エラーに見えることがある

}

}

}

    const name = p.name || p.address_line1 || q;
    const area = [p.state, p.city].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join('');

async function gsiSearch(q) {

const PHARMACY_BASE = 'pharmacy/';

async function pharmacyIndex() {
  if (pharmacyCache.index) return pharmacyCache.index;
  const r = await fetch(PHARMACY_BASE + 'index.json');

async function pharmacyNear(center, radius) {
  const idx = await pharmacyIndex();

      if (idx.tiles[`${a}_${b}`]) keys.push(`${a}_${b}`);
  const rows = (await Promise.all(keys.map(async k => {
    if (!pharmacyCache.tiles[k]) { const r = await fetch(PHARMACY_BASE + k + '.json'); if (!r.ok) throw new Error('no-data'); pharmacyCache.tiles[k] = await r.json(); }
    return pharmacyCache.tiles[k];

  const out = [];
  rows.forEach(([name, address, lat, lng, url, hours, approx]) => {
    const km = kmBetween(center.lat, center.lng, lat, lng);
    if (km * 1000 <= radius) out.push({name, brand:'', type:'薬局', lat, lng, km, address, hours, phone:'', url:safeUrl(url), src:'mhlw', approx:!!approx});

    .replace(/([月火水木金土日])-([月火水木金土日])/g, '$1〜$2')

function guessFromName(name) {

  const cat = state.catalog.find(c => toHalf(c.name).toLowerCase() === low) || (n.length >= 4 ? state.catalog.find(c => { const cn = toHalf(c.name).toLowerCase(); return cn.includes(low) || low.includes(cn); }) : null);
  if (cat) return {catalogId:cat.id, brand:cat.brand, purposes:cat.purposes.slice(), category:cat.category};
  const brands = Array.from(new Set(BRAND_SUGGEST.concat(BRAND_GUESS_EXTRA, state.catalog.map(c => c.brand)).filter(Boolean))).sort((a, b) => b.length - a.length);
  const sq = x => toHalf(x).toLowerCase().replace(/[\s・･\-‐ー_.]/g, ''); // 空白や「・」「ー」の違いは気にしない
  const lowSq = sq(n), brand = brands.find(b => sq(b).length >= 2 && lowSq.includes(sq(b))) || '';
  const purposes = PURPOSE_WORDS.filter(([, re]) => re.test(n)).map(([p]) => p);
  const g = guessCat(n);
  return {brand:brand || brandFromName(n, true), purposes, category:g === 'その他' ? '' : g};
}

  const opts = sel => used.map(p => `<option value="${esc(p.id)}" ${p.id === sel ? 'selected' : ''}>${esc(truncate(p.name, 30))}（${p.status === '使用終了' ? '過去' : p.status}）</option>`).join('');
  // 商品を押して選ぶ（A・Bの2つ）。プルダウンより選びやすいように、商品名のボタンを並べる
  const pick = (key, sel) => `<div class="cmp-pick" role="radiogroup">${used.map(p => `<button type="button" class="cmp-chip ${p.id === sel ? 'on' : ''} ${key === 'B' && p.id === ui.cmpA || key === 'A' && p.id === ui.cmpB ? 'dim' : ''}" data-cmp="${key}:${esc(p.id)}" role="radio" aria-checked="${p.id === sel}">${esc(truncate(shortName(p.name), 18))}<small>${p.status === '使用終了' ? '過去' : esc(p.status)}</small></button>`).join('')}</div>`;
  html += `<div class="card cmp-sel"><p class="cmp-lbl"><b class="cmp-a">A</b>くらべる商品</p>${pick('A', ui.cmpA)}<p class="cmp-lbl" style="margin-top:12px"><b class="cmp-b">B</b>くらべる商品</p>${ui.cmpB ? pick('B', ui.cmpB) : '<p class="small muted">ほかに比べられる商品がありません。</p>'}</div>`;
  html += `<div class="notice green">同じ時期に肌の変化があっても、その商品や成分が原因とは限りません。季節・睡眠・体調・生理周期・ほかの商品なども影響します。比較は記録の整理として使ってください。</div>
`;
  const A = getMy(ui.cmpA), B = getMy(ui.cmpB);
  const col = p => {
    if (!p) return {};
    const s = periodStats(p.startDate, productEnd(p));
    const days = diffDays(p.startDate, productEnd(p)) + 1;
    const spent = p.purchases.reduce((a,b) => a + b.price, 0);
    return {p, s, days, spent, fc:freqCheck(p, p.startDate, productEnd(p))};
  };
  const a = col(A), b = col(B);
  const show = (x, fn) => x.p ? fn(x) : '—';
  const enough = x => x.s && x.s.n >= 3;
  const rows = [
    ['期間', x => `${fmtShort(x.p.startDate)}〜${x.p.status === '使用終了' ? fmtShort(x.p.endDate) : '今日'}（${x.days}日）`],
    ['カテゴリ・目的', x => esc([x.p.category].concat(x.p.purposes).join('・'))],
    ['肌記録の件数', x => `${x.s.n}件`],
    ['肌の調子 平均', x => enough(x) ? f1(x.s.cond) : '記録不足'],
    ['ニキビ 1日平均', x => enough(x) ? f1(x.s.acneAvg) : '記録不足'],
    ['赤み／乾燥／皮脂', x => enough(x) ? `${f1(x.s.red)}／${f1(x.s.dry)}／${f1(x.s.oil)}` : '記録不足'],
    ['実際の使用記録', x => esc(x.fc.status === 'none' ? '記録なし' : `${x.fc.used}日使用（使用を記録した${x.fc.recorded}日中）`)],
    ['購入金額の合計', x => x.spent ? yen(x.spent) : '記録なし'],
    ['1日あたり', x => x.spent ? yen(x.spent / x.days) : '—'],
    ['メモ', x => esc(truncate(x.p.memo, 60) || '—')]
  ];
  // ひと目でわかる比較：肌の調子・ニキビ・赤み・乾燥・皮脂を、A と B で並べ、良いほうに色を付ける
  const metric = (label, ka, kb, betterLow, fmt) => {
    const va = enough(a) ? ka(a.s) : null, vb = enough(b) ? kb(b.s) : null;
    const win = va == null || vb == null || Math.abs(va - vb) < 0.05 ? '' : (betterLow ? (va < vb ? 'a' : 'b') : (va > vb ? 'a' : 'b'));
    return `<div class="cmp-m"><span class="cmp-ml">${label}</span><b class="${win === 'a' ? 'win' : ''}">${va == null ? '<small>記録不足</small>' : fmt(va)}</b><b class="${win === 'b' ? 'win' : ''}">${vb == null ? '<small>記録不足</small>' : fmt(vb)}</b></div>`;
  };
  html += `<div class="card"><div class="card-h"><h2>肌の状態をくらべる</h2><span class="chip">記録の平均</span></div>
    <div class="cmp-m cmp-mh"><span></span><b><i class="cmp-a">A</i>${A ? esc(truncate(shortName(A.name), 12)) : ''}</b><b><i class="cmp-b">B</i>${B ? esc(truncate(shortName(B.name), 12)) : ''}</b></div>
    ${metric('肌の調子', s => s.cond, s => s.cond, false, f1)}${metric('ニキビ/日', s => s.acneAvg, s => s.acneAvg, true, f1)}${metric('赤み', s => s.red, s => s.red, true, f1)}${metric('乾燥', s => s.dry, s => s.dry, true, f1)}${metric('皮脂', s => s.oil, s => s.oil, true, f1)}
    <p class="small muted" style="margin-top:8px">色が付いているほうが、その期間の肌の状態が良かった数字です（調子は高いほど、ほかは低いほど良い）。記録が3件未満の期間は出しません。</p></div>`;
  html += `<details class="card fold cmp-detail"><summary><b>くわしい表（期間・使用回数・金額など）</b></summary><div class="table-wrap" style="margin-top:10px"><table class="table">
    <thead><tr><th></th><th>${A ? esc(truncate(A.name, 20)) : 'A'}</th><th>${B ? esc(truncate(B.name, 20)) : 'B'}</th></tr></thead>
    <tbody>${rows.map(([l, fn]) => `<tr><td class="small muted">${l}</td><td>${show(a, fn)}</td><td>${show(b, fn)}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted" style="margin-top:10px">期間が重なっている場合、同じ肌記録が両方に含まれます。記録が3件未満の期間は数値を出しません。</p></details>`;
  // 商品を変えた時期の振り返り
  const t = todayStr();
  const events = [];
  state.myProducts.filter(isUsedType).forEach(p => { events.push({date:p.startDate, type:'開始', p}); if (p.status === '使用終了' && p.endDate) events.push({date:p.endDate, type:'終了', p}); });
  events.sort((x,y) => y.date.localeCompare(x.date));
  html += `<div class="card"><div class="card-h"><h2>商品を変えた時期の振り返り</h2></div>
    ${events.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>日付</th><th>出来事</th><th class="r">前14日</th><th class="r">後14日</th></tr></thead><tbody>
    ${events.slice(0, 20).map(ev => {
      const bS = periodStats(addDays(ev.date, -14), addDays(ev.date, -1));
      const aEnd = addDays(ev.date, 13) < t ? addDays(ev.date, 13) : t;
      const aS = periodStats(ev.date, aEnd);
      const fmt = s => s.n >= 3 ? `調子 ${f1(s.cond)}<div class="small muted">ニキビ ${f1(s.acneAvg)}</div>` : '<span class="small muted">記録不足</span>';
      return `<tr><td>${fmtShort(ev.date)}<div class="small muted">${esc(ev.date.slice(0,4))}年</div></td><td><span class="chip ${ev.type === '開始' ? 'green' : 'gray'}">${ev.type}</span> ${esc(truncate(ev.p.name, 22))}</td><td class="r">${fmt(bS)}</td><td class="r">${fmt(aS)}</td></tr>`;
    }).join('')}</tbody></table></div><p class="small muted" style="margin-top:10px">同じ時期に複数の商品を変えている場合、どの変更による違いかは区別できません。新しい商品は1つずつ試すと、記録を見比べやすくなります。</p>`
    : '<p class="small muted">まだ出来事がありません。</p>'}</div>`;
  return html;
}

function comboMap(r) {

  const avg = (a, k) => a.length ? a.reduce((s, l) => s + (Number(l[k]) || 0), 0) / a.length : 0, r1 = v => Math.round(v * 10) / 10;
  const rows = factorList().concat(WX_TAGS).map(f => { const on = logs.filter(l => (l.factors || []).includes(f)), off = logs.filter(l => !(l.factors || []).includes(f)); return {f, on, off}; }).filter(x => x.on.length >= 2 && x.off.length >= 2);
  if (!rows.length) return head + '<p class="small muted" style="margin:0">同じことがあった日が2日以上たまると、比べて表示します。</p></div>';
  return head + `<div class="fac-list">${rows.map(({f, on, off}) => { const da = avg(on, 'acneCount') - avg(off, 'acneCount'), dc = avg(on, 'condition') - avg(off, 'condition');
    const msg = da >= 0.5 ? `ニキビが<b class="bad">平均${r1(da)}個多め</b>` : da <= -0.5 ? `ニキビが平均${r1(-da)}個少なめ` : 'ニキビの数はほぼ同じ';
    return `<div class="fac-row"><b>${esc(f)}<small>（${on.length}日）</small></b><span>${msg}・調子 ${dc <= -0.3 ? `<b class="bad">${r1(dc)}</b>` : dc >= 0.3 ? `+${r1(dc)}` : 'ほぼ同じ'}</span></div>`; }).join('')}</div>
    <p class="small muted" style="margin:8px 0 0">あった日となかった日の平均を比べた目安です。これだけで原因とは言えません。</p></div>`;
}

// 写真を撮った時刻（"HH:MM"）を調べる：写真の中の撮影日時（Exif）→ なければファイルの日時
async function photoTime(file) {

          const m = dt && dt.match(/^\d{4}:\d\d:\d\d (\d\d):(\d\d)/);
          if (m) return `${m[1]}:${m[2]}`;
          break;
        }
        if ((mk & 0xFF00) !== 0xFF00 || mk === 0xFFDA) break;
        o += 2 + len;
      }
    }

  if (file.lastModified) { const d = new Date(file.lastModified); if (Date.now() - d < 3 * 86400000) return hm(d); }

}

      <div class="notice green" style="margin:12px 0 0">同じ時期に肌の変化があっても、その商品が原因とは限りません。季節・睡眠・体調・生理周期・ほかの商品なども影響します。</div></div>`;
  html += face3dCardHtml(); // 顔で見る肌の変化（無料プランでも見られる）
  if (locked()) return html + lockCard('詳細な分析', '睡眠・運動・食事の内容と肌の調子の比較、部位ごとの過去と現在の比較、前の期間との比較、90日間のグラフが使えます。');
  // 睡眠
  const sleepVals = dates.map(d => { const m = sleepMin(lm[d]); return m == null ? null : Math.round(m / 6) / 10; });
  const sleepN = sleepVals.filter(v => v != null).length;
  html += `<div class="card"><div class="card-h"><h2>睡眠時間と肌の調子</h2></div>`;
  if (sleepN < 2) html += `<p class="small muted">睡眠の記録が増えると表示されます（この期間：${sleepN}日）。</p><button class="btn btn-soft btn-sm" style="margin-top:8px" data-action="life-part" data-id="sleep">睡眠を記録</button>`;
  else {
    html += chartSlot('sleep', w => lineChart(w, {dates, height:170, yMin:0, yMax:12, yTicks:[0,6,12], yFmt:v => v + 'h', label:'睡眠時間の推移', series:[{name:'睡眠', color:'#7F8FB8', values:sleepVals, fmt:v => v + '時間'}]}));
    const both = dates.filter(d => map[d] && sleepMin(lm[d]) != null);
    const short = both.filter(d => sleepMin(lm[d]) < 360), long = both.filter(d => sleepMin(lm[d]) >= 360);
    html += short.length >= 3 && long.length >= 3
      ? `<table class="table" style="margin-top:12px"><thead><tr><th>睡眠</th><th class="r">日数</th><th class="r">肌の調子 平均</th><th class="r">ニキビ平均</th></tr></thead><tbody>
        <tr><td>6時間未満</td><td class="r">${short.length}</td><td class="r">${f1(avg(short.map(d => map[d].condition)))}</td><td class="r">${f1(avg(short.map(d => map[d].acneCount)))}</td></tr>
        <tr><td>6時間以上</td><td class="r">${long.length}</td><td class="r">${f1(avg(long.map(d => map[d].condition)))}</td><td class="r">${f1(avg(long.map(d => map[d].acneCount)))}</td></tr></tbody></table>
        <p class="small muted" style="margin-top:8px">差があっても、睡眠が原因とは断定できません（相関と因果は別です）。</p>`
      : '<p class="small muted" style="margin-top:8px">「6時間未満」「6時間以上」の日がそれぞれ3日以上になると、肌の調子の平均を並べて表示します。</p>';
  }
  html += '</div>';
  // 運動と肌の調子
  const exVals = dates.map(d => lm[d] && lm[d].exRecorded ? exTotal(lm[d]) : null);
  const exN = exVals.filter(v => v != null).length;
  html += `<div class="card"><div class="card-h"><h2>運動と肌の調子</h2></div>`;
  if (exN < 2) html += `<p class="small muted">運動の記録が増えると表示されます（この期間：${exN}日）。</p><button class="btn btn-soft btn-sm" style="margin-top:8px" data-action="life-part" data-id="exercise">運動を記録</button>`;
  else {
    const exTop = Math.max(60, Math.ceil(Math.max(...exVals.filter(v => v != null)) / 30) * 30);
    html += chartSlot('exercise', w => lineChart(w, {dates, height:170, yMin:0, yMax:exTop, yTicks:[0, exTop / 2, exTop], yFmt:v => v + '分', label:'運動時間の推移', series:[{name:'運動', color:'#6FA38A', values:exVals, fmt:v => v + '分'}]}));
    const both = dates.filter(d => map[d] && lm[d] && lm[d].exRecorded);
    const act = both.filter(d => exTotal(lm[d]) >= 20), rest = both.filter(d => exTotal(lm[d]) < 20);
    html += act.length >= 3 && rest.length >= 3
      ? `<table class="table" style="margin-top:12px"><thead><tr><th>運動</th><th class="r">日数</th><th class="r">肌の調子 平均</th><th class="r">ニキビ平均</th></tr></thead><tbody>
        <tr><td>20分以上</td><td class="r">${act.length}</td><td class="r">${f1(avg(act.map(d => map[d].condition)))}</td><td class="r">${f1(avg(act.map(d => map[d].acneCount)))}</td></tr>
        <tr><td>20分未満・なし</td><td class="r">${rest.length}</td><td class="r">${f1(avg(rest.map(d => map[d].condition)))}</td><td class="r">${f1(avg(rest.map(d => map[d].acneCount)))}</td></tr></tbody></table>
        <p class="small muted" style="margin-top:8px">差があっても、運動が原因とは断定できません（相関と因果は別です）。</p>`
      : '<p class="small muted" style="margin-top:8px">「20分以上運動した日」「それ以外の日」がそれぞれ3日以上になると、肌の調子の平均を並べて表示します。</p>';
  }
  html += '</div>';
  // 食事の内容と肌の調子
  const lifeR = lifeInRange(start, end).filter(l => map[l.date]);
  const rowsF = FOOD_TAGS.map(tag => ({tag, w:lifeR.filter(l => l.tags.includes(tag)), wo:lifeR.filter(l => !l.tags.includes(tag))})).filter(x => x.w.length);
  const cAvg = arr => f1(avg(arr.map(l => map[l.date].condition)));
  html += `<div class="card"><div class="card-h"><h2>食事の内容と肌の調子</h2></div>${!rowsF.length
    ? '<p class="small muted">「食事・睡眠」で食事の内容にチェックすると、その日の肌の調子と並べて表示します。</p>'
    : `<div class="table-wrap"><table class="table"><thead><tr><th>食事の内容</th><th class="r">あった日</th><th class="r">なかった日</th></tr></thead><tbody>${rowsF.map(x => { const ok = x.w.length >= 3 && x.wo.length >= 3;
        return `<tr><td>${esc(x.tag)}</td><td class="r">${ok ? '調子 ' + cAvg(x.w) : '記録不足'}<div class="small muted">${x.w.length}日</div></td><td class="r">${ok ? '調子 ' + cAvg(x.wo) : '—'}<div class="small muted">${x.wo.length}日</div></td></tr>`; }).join('')}</tbody></table></div>
      <p class="small muted" style="margin-top:8px">その日の肌の調子（1〜5）の平均です。「あった日」「なかった日」がそれぞれ3日以上ある項目だけ数値を出します。差があっても、食事が原因とは断定できません。</p>`}</div>`;
  // 部位：過去と現在
  const prevS = addDays(start, -ui.chartRange), prevE = addDays(start, -1);
  const curLogs = logsInRange(start, end), prevLogs = logsInRange(prevS, prevE);
  const mode = curLogs.concat(prevLogs).some(l => l.acneSpots.length) ? 'spots' : 'areas';
  const cA = areaCounts(prevLogs, mode), cB = areaCounts(curLogs, mode);
  const mx = Math.max(1, ...Object.values(cA), ...Object.values(cB));
  html += `<div class="card"><div class="card-h"><h2>部位ごとの記録：過去と現在</h2></div>
    <p class="small muted" style="margin-bottom:10px">${mode === 'spots' ? '数字は「ニキビの詳細」で記録した個数の合計です。' : '数字は「気になる部位」に選んだ日数です。'}</p>
    <div class="face-pair"><div><h4>前の${ui.chartRange}日間（${prevLogs.length}件）</h4>${faceHeat(cA, mx)}</div><div><h4>直近${ui.chartRange}日間（${curLogs.length}件）</h4>${faceHeat(cB, mx)}</div></div>
    ${prevLogs.length < 3 || curLogs.length < 3 ? '<p class="small muted" style="margin-top:8px">どちらかの期間の記録が3件未満のため、比較の参考にしにくい状態です。</p>' : ''}</div>`;
  // 期間比較
  const a = stats(prevLogs), b = stats(curLogs);
  html += `<div class="card"><div class="card-h"><h2>前の期間との比較</h2><span class="chip">ルールに基づく集計</span></div>
    ${a.n >= 3 && b.n >= 3 ? `<table class="table"><thead><tr><th>項目</th><th class="r">前の${ui.chartRange}日（${a.n}件）</th><th class="r">直近${ui.chartRange}日（${b.n}件）</th></tr></thead><tbody>
      <tr><td>肌の調子</td><td class="r">${f1(a.cond)}</td><td class="r">${f1(b.cond)}</td></tr>
      <tr><td>ニキビ（1日平均）</td><td class="r">${f1(a.acneAvg)}</td><td class="r">${f1(b.acneAvg)}</td></tr>
      <tr><td>赤み</td><td class="r">${f1(a.red)}</td><td class="r">${f1(b.red)}</td></tr>
      <tr><td>乾燥</td><td class="r">${f1(a.dry)}</td><td class="r">${f1(b.dry)}</td></tr>
      <tr><td>皮脂</td><td class="r">${f1(a.oil)}</td><td class="r">${f1(b.oil)}</td></tr></tbody></table>
      <p class="small muted" style="margin-top:10px">記録の平均値を並べたものです。AIによる分析ではありません。</p>`
    : '<p class="small muted">両方の期間に3件以上の記録があると、平均値を並べて表示します。</p>'}</div>`;
  return html;
}

/* =========================================================
   画面：週次レポート
   ========================================================= */
function tagSummary(lifeLogs) {
  const c = {};
  lifeLogs.forEach(l => l.tags.forEach(x => c[x] = (c[x] || 0) + 1));
  const e = Object.entries(c).sort((a,b) => b[1] - a[1]);
  return e.length ? e.map(([k, n]) => `${k} ${n}日`).join('、') : '記録なし';
}
function viewReport() {
  const t = todayStr();
  const ws = addDays(weekStart(t), ui.reportOffset * 7), we = addDays(ws, 6);
  const effEnd = we < t ? we : t;
  const logs = logsInRange(ws, we), prev = logsInRange(addDays(ws, -7), addDays(ws, -1));
  const s = stats(logs), p = stats(prev);
  const map = logMap();
  const used = productsDuring(ws, effEnd);
  const started = state.myProducts.filter(x => isUsedType(x) && x.startDate >= ws && x.startDate <= we);
  const ended = state.myProducts.filter(x => x.status === '使用終了' && x.endDate >= ws && x.endDate <= we);
  const buys = purchasesIn(ws, we), spent = buys.reduce((a,b) => a + b.price, 0);
  const daysElapsed = ws > t ? 0 : Math.min(7, diffDays(ws, t) + 1);
  const lifeW = lifeInRange(ws, we);
  const sleepW = lifeW.map(sleepMin).filter(v => v != null);
  const sleepP = lifeInRange(addDays(ws, -7), addDays(ws, -1)).map(sleepMin).filter(v => v != null);

  let html = pageHead('週次レポート', '1週間分の記録をまとめます。') +
    `<div class="card nav-bar" style="margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" data-action="report-prev">← 前の週</button>
      <strong style="text-align:center">${fmtMD(ws)} 〜 ${fmtMD(we)}${ui.reportOffset === 0 ? '<br><span class="small muted" style="font-weight:400">今週</span>' : ''}</strong>
      <button class="btn btn-ghost btn-sm" data-action="report-next" ${ui.reportOffset >= 0 ? 'disabled' : ''}>次の週 →</button></div>
    <div class="notice green">このレポートは、入力された記録を決められたルールで集計したものです。AIによる分析ではありません。記録がない項目は推測せず「記録なし」と表示します。</div>`;

  html += `<div class="card"><div class="card-h"><h2>肌の記録</h2><span class="small muted">${s.n} / ${daysElapsed || 7}日 記録</span></div>
    <div class="week-strip">${datesRange(ws, we).map(d => { const L = map[d], dd = parseYmd(d);
      return `<div class="d">${WD[dd.getDay()]}<br>${dd.getDate()}${L ? `<div class="dot" style="background:${COND_COLORS[L.condition]};color:${COND_FG[L.condition]}" title="${esc(COND_LABELS[L.condition])}">${L.condition}</div><div style="margin-top:3px;color:var(--ink2)">ニキビ${L.acneCount}</div>` : `<div class="dot none">${d > t ? '' : '–'}</div>`}</div>`; }).join('')}</div>
    <p class="small muted" style="margin-top:8px">丸の数字は肌の調子（1=とても悪い〜5=とても良い）、その下はニキビの記録数です。</p></div>`;

  html += logs.length ? `<div class="card"><div class="card-h"><h2>肌状態とニキビ数の変化</h2></div>
      <div class="stat-row" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
        <div class="stat"><div class="lbl">肌の調子 平均</div><div class="val">${f1(s.cond)}</div><div class="sub">${deltaChip(s.cond, p.cond, 'up')}</div></div>
        <div class="stat"><div class="lbl">ニキビ 合計</div><div class="val">${s.acneTotal}<span class="small muted">個</span></div><div class="sub">1日平均 ${f1(s.acneAvg)}</div></div>
        <div class="stat"><div class="lbl">ニキビ 1日平均</div><div class="val">${f1(s.acneAvg)}</div><div class="sub">${deltaChip(s.acneAvg, p.acneAvg, 'down')}</div></div>
        <div class="stat"><div class="lbl">赤み 平均</div><div class="val">${f1(s.red)}</div><div class="sub">${deltaChip(s.red, p.red, 'down')}</div></div>
        <div class="stat"><div class="lbl">乾燥 平均</div><div class="val">${f1(s.dry)}</div><div class="sub">${deltaChip(s.dry, p.dry, 'down')}</div></div>
        <div class="stat"><div class="lbl">皮脂 平均</div><div class="val">${f1(s.oil)}</div><div class="sub">${deltaChip(s.oil, p.oil, 'down')}</div></div>
      </div><p class="small muted" style="margin-top:10px">前週の記録：${p.n}日分。記録日数が少ない場合、平均値は大きく変わります。</p></div>`
    : `<div class="card">${emptyBox('calendar', 'この週の肌記録はありません', '記録をつけると、ニキビ数や自己評価の変化がここに集計されます。', ui.reportOffset === 0 ? '<button class="btn btn-primary btn-sm" data-action="new-log">記録する</button>' : '')}</div>`;

  // 記録がない項目のカードは出さない（短く見やすくする）
  if (used.length) html += `<div class="card"><div class="card-h"><h2>使用した商品と使用頻度の振り返り</h2></div>
    ${used.length ? used.map(x => { const fc = freqCheck(x, ws, effEnd); return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><a href="#/my/${encodeURIComponent(x.id)}" style="color:inherit;font-weight:600">${esc(x.name)}</a><span class="small muted">${esc(x.timing)}・予定 ${esc(x.frequency)}</span></div>
      <div class="chips" style="margin-top:4px">${started.includes(x) ? '<span class="chip green">この週に開始</span>' : ''}${ended.includes(x) ? '<span class="chip gray">この週に終了</span>' : ''}${x.status === '一時停止' ? '<span class="chip warn">一時停止中</span>' : ''}</div>
      <div class="small ${fc.status === 'over' ? '' : 'muted'}" style="margin-top:4px;${fc.status === 'over' ? 'color:var(--warn)' : ''}">実際の使用：${esc(fc.status === 'none' ? '記録なし' : fc.text.replace(/^.*?→ /, `${fc.used}日 → `))}</div></div>`; }).join('')
      : '<p class="small muted">この週に使用期間が重なる商品は登録されていません。</p>'}</div>`;

  const cr = comboReport(used);
  if (used.length) html += `<div class="card"><div class="card-h"><h2>成分の特徴と注意点</h2><a class="link" href="#/combo">詳しく見る →</a></div>
    ${!used.length ? '<p class="small muted">記録なし</p>'
      : `<p class="small" style="margin-bottom:8px">解説のある成分：${cr.byIng.length ? cr.byIng.map(x => `<a href="#/ingredients/${x.entry.key}">${esc(x.entry.name)}</a>`).join('、') : 'なし'}</p>
      ${cr.missing.length ? `<p class="small" style="color:var(--warn)">全成分が未登録の商品：${cr.missing.length}件（情報不足のため判断していません）</p>` : ''}
      ${cr.alerts.length ? cr.alerts.map(a => `<div class="alert-card" style="margin-top:8px"><b>${esc(a.rule.title)}</b>${esc(a.rule.note)}</div>`).join('') : '<p class="small muted">この辞典で注意を表示している組み合わせは見つかりませんでした（安全を意味するものではありません）。</p>'}`}</div>`;

  if (lifeW.length) html += `<div class="card"><div class="card-h"><h2>食事・睡眠</h2></div>
    ${lifeW.length ? `<dl class="kv"><dt>記録した日</dt><dd>${lifeW.length}日</dd><dt>平均睡眠</dt><dd>${sleepW.length ? esc(fmtHM(avg(sleepW))) : '記録なし'}${sleepW.length && sleepP.length ? `（前週 ${esc(fmtHM(avg(sleepP)))}）` : ''}</dd>
      <dt>6時間未満の日</dt><dd>${sleepW.length ? sleepW.filter(m => m < 360).length + '日' : '記録なし'}</dd>
      <dt>朝食を食べた日</dt><dd>${lifeW.filter(l => l.meals.breakfast.ate).length}日</dd>
      <dt>野菜「しっかり」</dt><dd>${lifeW.some(l => l.veg) ? lifeW.filter(l => l.veg === 'しっかり').length + '日' : '記録なし'}</dd>
      <dt>甘いもの「多め」</dt><dd>${lifeW.some(l => l.sweets) ? lifeW.filter(l => l.sweets === '多め').length + '日' : '記録なし'}</dd><dt>食事の内容</dt><dd>${esc(tagSummary(lifeW))}</dd>
      <dt>運動</dt><dd>${(() => { const e = lifeW.filter(l => l.exRecorded); return e.length ? `${e.filter(l => exTotal(l) > 0).length}日・合計 ${esc(fmtMin(e.reduce((a, l) => a + exTotal(l), 0)))}` : '記録なし'; })()}</dd>
      <dt>平均歩数</dt><dd>${(() => { const st = lifeW.filter(l => l.steps != null).map(l => l.steps); return st.length ? Math.round(avg(st)).toLocaleString() + '歩' : '記録なし'; })()}</dd>
      <dt>栄養（目安・1日平均）</dt><dd>${(() => { const n = lifeW.filter(l => l.foods.length); if (!n.length) return '記録なし'; const tt = n.map(l => nutTotals(l.foods)); const a = k => avg(tt.map(x => x[k])); return esc(nutLine({kcal:a('kcal'), p:a('p'), f:a('f'), c:a('c'), veg:a('veg')})) + `<div class="small muted">${n.length}日分の記録から計算した概算です</div>`; })()}</dd></dl>`
      : '<p class="small muted">記録なし</p>'}</div>`;

  if (buys.length) html += `<div class="card"><div class="card-h"><h2>化粧品への支出</h2></div><div class="big-stat">${yen(spent)}</div>
    ${buys.length ? `<table class="table" style="margin-top:10px"><tbody>${buys.map(b => `<tr><td>${esc(b.name)}<div class="small muted">${fmtShort(b.date)}</div></td><td class="r">${yen(b.price)}</td></tr>`).join('')}</tbody></table>` : '<p class="small muted" style="margin-top:6px">この週の購入記録はありません。</p>'}</div>`;

  // 翌週に確認するとよいポイント（ルールに基づく）
  const pts = [];
  if (s.n < 4 && daysElapsed >= 4) pts.push(`この週の肌の記録は${s.n}日でした。週4日以上記録すると、変化を比べやすくなります。`);
  if (started.length) pts.push(`「${started.map(x => x.name).join('」「')}」の使用を開始しました。新しい商品を同時にいくつも増やさず、1つずつ試すと記録を見比べやすくなります。`);
  if (started.length >= 2) pts.push('この週に2つ以上の商品を使い始めています。肌に変化があっても、どの商品によるものかを区別しにくくなります。');
  used.forEach(x => { if (freqCheck(x, ws, effEnd).status === 'over') pts.push(`「${x.name}」の使用回数が、登録した頻度より多くなっています。製品の使用方法を確認してください。`); });
  if (used.length && !logs.some(l => l.usageRecorded)) pts.push('「今日使った化粧品」を記録すると、予定と実際の使用頻度を比べられます。');
  if (s.acneAvg != null && p.acneAvg != null && s.acneAvg - p.acneAvg >= 0.5) pts.push('ニキビの記録数が前週より増えています。「ニキビの詳細」で部位・大きさ・経過を記録しておくと、振り返りやすくなります。');
  if (s.dry != null && s.dry >= 3) pts.push('乾燥の自己評価が高めでした。室内の湿度や洗顔の回数など、商品以外の状況もメモしておきましょう。');
  if (s.red != null && s.red >= 3) pts.push('赤みの自己評価が高めでした。赤みが続く・悪化する場合は、自己判断せず皮膚科医に相談してください。');
  if (sleepW.length && sleepW.filter(m => m < 360).length >= 3) pts.push('睡眠が6時間未満の日が3日以上ありました。睡眠と肌の記録を引き続き並べて見てみましょう。');
  if (!lifeW.length) pts.push('食事・睡眠の記録がありません。就寝・起床時刻だけでも記録すると、肌記録と並べて振り返れます。');
  const areaCount = {};
