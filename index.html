      ${chartSlot('rdo', w => lineChart(w, {dates, yMin:0, yMax:5, yTicks:[0,1,2,3,4,5], label:'赤み・乾燥・皮脂の推移', series:[{name:'赤み', color:'#D3876F', values:vals('redness')},{name:'乾燥', color:'#C7A876', values:vals('dryness')},{name:'皮脂', color:'#7FA3B8', values:vals('oil')}]}))}</div>
    <div class="card"><div class="card-h"><h2>使用商品と肌記録の時系列</h2></div>
      <p class="small muted" style="margin-bottom:8px">上：肌の調子（1〜5）／下：各商品の使用期間（濃い点＝「使った」と記録した日）</p>
      ${chartSlot('timeline', w => timelineChart(w, {dates, values:vals('condition'), used:usedDays, products:productsDuring(start, end).sort((a,b) => a.startDate.localeCompare(b.startDate))}))}
      <div class="notice green" style="margin:12px 0 0">同じ時期に肌の変化があっても、その商品が原因とは限りません。季節・睡眠・体調・生理周期・ほかの商品なども影響します。</div></div>`;
  html += face3dCardHtml(); // 顔で見る肌の変化（無料プランでも見られる）
  if (locked()) return html + lockCard('詳細な分析', '睡眠・運動・食事の内容と肌の調子の比較、部位ごとの過去と現在の比較、前の期間との比較、90日間のグラフが使えます。');
  // 睡眠
  const sleepVals = dates.map(d => { const m = sleepMin(lm[d]); return m == null ? null : Math.round(m / 6) / 10; });
  const sleepN = sleepVals.filter(v => v != null).length;
  html += `<div class="card"><div class="card-h"><h2>睡眠時間と肌の調子</h2></div>`;
  if (sleepN < 2) html += `<p class="small muted">睡眠の記録が増えると表示されます（この期間：${sleepN}日）。</p><button class="btn btn-soft btn-sm" style="margin-top:8px" data-action="life-part" data-id="sleep">睡眠を記録</button>`;
  else {
    html += chartSlot('sleep', w => lineChart(w, {dates, height:170, yMin:0, yMax:12, yTicks:[0,6,12], yFmt:v => v + 'h', label:'睡眠時間の推移', series:[{name:'睡眠', color:'#7F8FB8', values:sleepVals, fmt:v => v + '時間'}]}));
    const both = dates.filter(d => map[d] && sleepMin(lm[d]) != null);
    const short = both.filter(d => sleepMin(lm[d]) < 360), long = both.filter(d => sleepMin(lm[d]) >= 360);
    html += short.length >= 3 && long.length >= 3
      ? `<table class="table" style="margin-top:12px"><thead><tr><th>睡眠</th><th class="r">日数</th><th class="r">肌の調子 平均</th><th class="r">ニキビ平均</th></tr></thead><tbody>
        <tr><td>6時間未満</td><td class="r">${short.length}</td><td class="r">${f1(avg(short.map(d => map[d].condition)))}</td><td class="r">${f1(avg(short.map(d => map[d].acneCount)))}</td></tr>
        <tr><td>6時間以上</td><td class="r">${long.length}</td><td class="r">${f1(avg(long.map(d => map[d].condition)))}</td><td class="r">${f1(avg(long.map(d => map[d].acneCount)))}</td></tr></tbody></table>
        <p class="small muted" style="margin-top:8px">差があっても、睡眠が原因とは断定できません（相関と因果は別です）。</p>`
      : '<p class="small muted" style="margin-top:8px">「6時間未満」「6時間以上」の日がそれぞれ3日以上になると、肌の調子の平均を並べて表示します。</p>';
  }
  html += '</div>';
  // 運動と肌の調子
  const exVals = dates.map(d => lm[d] && lm[d].exRecorded ? exTotal(lm[d]) : null);
  const exN = exVals.filter(v => v != null).length;
  html += `<div class="card"><div class="card-h"><h2>運動と肌の調子</h2></div>`;
  if (exN < 2) html += `<p class="small muted">運動の記録が増えると表示されます（この期間：${exN}日）。</p><button class="btn btn-soft btn-sm" style="margin-top:8px" data-action="life-part" data-id="exercise">運動を記録</button>`;
  else {
    const exTop = Math.max(60, Math.ceil(Math.max(...exVals.filter(v => v != null)) / 30) * 30);
    html += chartSlot('exercise', w => lineChart(w, {dates, height:170, yMin:0, yMax:exTop, yTicks:[0, exTop / 2, exTop], yFmt:v => v + '分', label:'運動時間の推移', series:[{name:'運動', color:'#6FA38A', values:exVals, fmt:v => v + '分'}]}));
    const both = dates.filter(d => map[d] && lm[d] && lm[d].exRecorded);
    const act = both.filter(d => exTotal(lm[d]) >= 20), rest = both.filter(d => exTotal(lm[d]) < 20);
    html += act.length >= 3 && rest.length >= 3
      ? `<table class="table" style="margin-top:12px"><thead><tr><th>運動</th><th class="r">日数</th><th class="r">肌の調子 平均</th><th class="r">ニキビ平均</th></tr></thead><tbody>
        <tr><td>20分以上</td><td class="r">${act.length}</td><td class="r">${f1(avg(act.map(d => map[d].condition)))}</td><td class="r">${f1(avg(act.map(d => map[d].acneCount)))}</td></tr>
        <tr><td>20分未満・なし</td><td class="r">${rest.length}</td><td class="r">${f1(avg(rest.map(d => map[d].condition)))}</td><td class="r">${f1(avg(rest.map(d => map[d].acneCount)))}</td></tr></tbody></table>
        <p class="small muted" style="margin-top:8px">差があっても、運動が原因とは断定できません（相関と因果は別です）。</p>`
      : '<p class="small muted" style="margin-top:8px">「20分以上運動した日」「それ以外の日」がそれぞれ3日以上になると、肌の調子の平均を並べて表示します。</p>';
  }
  html += '</div>';
  // 食事の内容と肌の調子
  const lifeR = lifeInRange(start, end).filter(l => map[l.date]);
  const rowsF = FOOD_TAGS.map(tag => ({tag, w:lifeR.filter(l => l.tags.includes(tag)), wo:lifeR.filter(l => !l.tags.includes(tag))})).filter(x => x.w.length);
  const cAvg = arr => f1(avg(arr.map(l => map[l.date].condition)));
  html += `<div class="card"><div class="card-h"><h2>食事の内容と肌の調子</h2></div>${!rowsF.length
    ? '<p class="small muted">「食事・睡眠」で食事の内容にチェックすると、その日の肌の調子と並べて表示します。</p>'
    : `<div class="table-wrap"><table class="table"><thead><tr><th>食事の内容</th><th class="r">あった日</th><th class="r">なかった日</th></tr></thead><tbody>${rowsF.map(x => { const ok = x.w.length >= 3 && x.wo.length >= 3;
        return `<tr><td>${esc(x.tag)}</td><td class="r">${ok ? '調子 ' + cAvg(x.w) : '記録不足'}<div class="small muted">${x.w.length}日</div></td><td class="r">${ok ? '調子 ' + cAvg(x.wo) : '—'}<div class="small muted">${x.wo.length}日</div></td></tr>`; }).join('')}</tbody></table></div>
      <p class="small muted" style="margin-top:8px">その日の肌の調子（1〜5）の平均です。「あった日」「なかった日」がそれぞれ3日以上ある項目だけ数値を出します。差があっても、食事が原因とは断定できません。</p>`}</div>`;
  // 部位：過去と現在
  const prevS = addDays(start, -ui.chartRange), prevE = addDays(start, -1);
  const curLogs = logsInRange(start, end), prevLogs = logsInRange(prevS, prevE);
  const mode = curLogs.concat(prevLogs).some(l => l.acneSpots.length) ? 'spots' : 'areas';
  const cA = areaCounts(prevLogs, mode), cB = areaCounts(curLogs, mode);
  const mx = Math.max(1, ...Object.values(cA), ...Object.values(cB));
  html += `<div class="card"><div class="card-h"><h2>部位ごとの記録：過去と現在</h2></div>
    <p class="small muted" style="margin-bottom:10px">${mode === 'spots' ? '数字は「ニキビの詳細」で記録した個数の合計です。' : '数字は「気になる部位」に選んだ日数です。'}</p>
    <div class="face-pair"><div><h4>前の${ui.chartRange}日間（${prevLogs.length}件）</h4>${faceHeat(cA, mx)}</div><div><h4>直近${ui.chartRange}日間（${curLogs.length}件）</h4>${faceHeat(cB, mx)}</div></div>
    ${prevLogs.length < 3 || curLogs.length < 3 ? '<p class="small muted" style="margin-top:8px">どちらかの期間の記録が3件未満のため、比較の参考にしにくい状態です。</p>' : ''}</div>`;
  // 期間比較
  const a = stats(prevLogs), b = stats(curLogs);
  html += `<div class="card"><div class="card-h"><h2>前の期間との比較</h2><span class="chip">ルールに基づく集計</span></div>
    ${a.n >= 3 && b.n >= 3 ? `<table class="table"><thead><tr><th>項目</th><th class="r">前の${ui.chartRange}日（${a.n}件）</th><th class="r">直近${ui.chartRange}日（${b.n}件）</th></tr></thead><tbody>
      <tr><td>肌の調子</td><td class="r">${f1(a.cond)}</td><td class="r">${f1(b.cond)}</td></tr>
      <tr><td>ニキビ（1日平均）</td><td class="r">${f1(a.acneAvg)}</td><td class="r">${f1(b.acneAvg)}</td></tr>
      <tr><td>赤み</td><td class="r">${f1(a.red)}</td><td class="r">${f1(b.red)}</td></tr>
      <tr><td>乾燥</td><td class="r">${f1(a.dry)}</td><td class="r">${f1(b.dry)}</td></tr>
      <tr><td>皮脂</td><td class="r">${f1(a.oil)}</td><td class="r">${f1(b.oil)}</td></tr></tbody></table>
      <p class="small muted" style="margin-top:10px">記録の平均値を並べたものです。AIによる分析ではありません。</p>`
    : '<p class="small muted">両方の期間に3件以上の記録があると、平均値を並べて表示します。</p>'}</div>`;
  return html;
}

/* =========================================================
   画面：週次レポート
   ========================================================= */
function tagSummary(lifeLogs) {
  const c = {};
  lifeLogs.forEach(l => l.tags.forEach(x => c[x] = (c[x] || 0) + 1));
  const e = Object.entries(c).sort((a,b) => b[1] - a[1]);
  return e.length ? e.map(([k, n]) => `${k} ${n}日`).join('、') : '記録なし';
}
function viewReport() {
  const t = todayStr();
  const ws = addDays(weekStart(t), ui.reportOffset * 7), we = addDays(ws, 6);
  const effEnd = we < t ? we : t;
  const logs = logsInRange(ws, we), prev = logsInRange(addDays(ws, -7), addDays(ws, -1));
  const s = stats(logs), p = stats(prev);
  const map = logMap();
  const used = productsDuring(ws, effEnd);
  const started = state.myProducts.filter(x => isUsedType(x) && x.startDate >= ws && x.startDate <= we);
  const ended = state.myProducts.filter(x => x.status === '使用終了' && x.endDate >= ws && x.endDate <= we);
  const buys = purchasesIn(ws, we), spent = buys.reduce((a,b) => a + b.price, 0);
  const daysElapsed = ws > t ? 0 : Math.min(7, diffDays(ws, t) + 1);
  const lifeW = lifeInRange(ws, we);
  const sleepW = lifeW.map(sleepMin).filter(v => v != null);
  const sleepP = lifeInRange(addDays(ws, -7), addDays(ws, -1)).map(sleepMin).filter(v => v != null);

  let html = pageHead('週次レポート', '1週間分の記録をまとめます。') +
    `<div class="card nav-bar" style="margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" data-action="report-prev">← 前の週</button>
      <strong style="text-align:center">${fmtMD(ws)} 〜 ${fmtMD(we)}${ui.reportOffset === 0 ? '<br><span class="small muted" style="font-weight:400">今週</span>' : ''}</strong>
      <button class="btn btn-ghost btn-sm" data-action="report-next" ${ui.reportOffset >= 0 ? 'disabled' : ''}>次の週 →</button></div>
    <div class="notice green">このレポートは、入力された記録を決められたルールで集計したものです。AIによる分析ではありません。記録がない項目は推測せず「記録なし」と表示します。</div>`;

  html += `<div class="card"><div class="card-h"><h2>肌の記録</h2><span class="small muted">${s.n} / ${daysElapsed || 7}日 記録</span></div>
    <div class="week-strip">${datesRange(ws, we).map(d => { const L = map[d], dd = parseYmd(d);
      return `<div class="d">${WD[dd.getDay()]}<br>${dd.getDate()}${L ? `<div class="dot" style="background:${COND_COLORS[L.condition]}" title="${esc(COND_LABELS[L.condition])}">${L.condition}</div><div style="margin-top:3px;color:var(--ink2)">ニキビ${L.acneCount}</div>` : `<div class="dot none">${d > t ? '' : '–'}</div>`}</div>`; }).join('')}</div>
    <p class="small muted" style="margin-top:8px">丸の数字は肌の調子（1=とても悪い〜5=とても良い）、その下はニキビの記録数です。</p></div>`;

  html += logs.length ? `<div class="card"><div class="card-h"><h2>肌状態とニキビ数の変化</h2></div>
      <div class="stat-row" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
        <div class="stat"><div class="lbl">肌の調子 平均</div><div class="val">${f1(s.cond)}</div><div class="sub">${deltaChip(s.cond, p.cond, 'up')}</div></div>
        <div class="stat"><div class="lbl">ニキビ 合計</div><div class="val">${s.acneTotal}<span class="small muted">個</span></div><div class="sub">1日平均 ${f1(s.acneAvg)}</div></div>
        <div class="stat"><div class="lbl">ニキビ 1日平均</div><div class="val">${f1(s.acneAvg)}</div><div class="sub">${deltaChip(s.acneAvg, p.acneAvg, 'down')}</div></div>
        <div class="stat"><div class="lbl">赤み 平均</div><div class="val">${f1(s.red)}</div><div class="sub">${deltaChip(s.red, p.red, 'down')}</div></div>
        <div class="stat"><div class="lbl">乾燥 平均</div><div class="val">${f1(s.dry)}</div><div class="sub">${deltaChip(s.dry, p.dry, 'down')}</div></div>
        <div class="stat"><div class="lbl">皮脂 平均</div><div class="val">${f1(s.oil)}</div><div class="sub">${deltaChip(s.oil, p.oil, 'down')}</div></div>
      </div><p class="small muted" style="margin-top:10px">前週の記録：${p.n}日分。記録日数が少ない場合、平均値は大きく変わります。</p></div>`
    : `<div class="card">${emptyBox('calendar', 'この週の肌記録はありません', '記録をつけると、ニキビ数や自己評価の変化がここに集計されます。', ui.reportOffset === 0 ? '<button class="btn btn-primary btn-sm" data-action="new-log">記録する</button>' : '')}</div>`;

  html += `<div class="card"><div class="card-h"><h2>使用した商品と使用頻度の振り返り</h2></div>
    ${used.length ? used.map(x => { const fc = freqCheck(x, ws, effEnd); return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><a href="#/my/${encodeURIComponent(x.id)}" style="color:inherit;font-weight:600">${esc(x.name)}</a><span class="small muted">${esc(x.timing)}・予定 ${esc(x.frequency)}</span></div>
      <div class="chips" style="margin-top:4px">${started.includes(x) ? '<span class="chip green">この週に開始</span>' : ''}${ended.includes(x) ? '<span class="chip gray">この週に終了</span>' : ''}${x.status === '一時停止' ? '<span class="chip warn">一時停止中</span>' : ''}</div>
      <div class="small ${fc.status === 'over' ? '' : 'muted'}" style="margin-top:4px;${fc.status === 'over' ? 'color:var(--warn)' : ''}">実際の使用：${esc(fc.status === 'none' ? '記録なし' : fc.text.replace(/^.*?→ /, `${fc.used}日 → `))}</div></div>`; }).join('')
      : '<p class="small muted">この週に使用期間が重なる商品は登録されていません。</p>'}</div>`;

  const cr = comboReport(used);
  html += `<div class="card"><div class="card-h"><h2>成分の特徴と注意点</h2><a class="link" href="#/combo">詳しく見る →</a></div>
    ${!used.length ? '<p class="small muted">記録なし</p>'
      : `<p class="small" style="margin-bottom:8px">解説のある成分：${cr.byIng.length ? cr.byIng.map(x => `<a href="#/ingredients/${x.entry.key}">${esc(x.entry.name)}</a>`).join('、') : 'なし'}</p>
      ${cr.missing.length ? `<p class="small" style="color:var(--warn)">全成分が未登録の商品：${cr.missing.length}件（情報不足のため判断していません）</p>` : ''}
      ${cr.alerts.length ? cr.alerts.map(a => `<div class="alert-card" style="margin-top:8px"><b>${esc(a.rule.title)}</b>${esc(a.rule.note)}</div>`).join('') : '<p class="small muted">この辞典で注意を表示している組み合わせは見つかりませんでした（安全を意味するものではありません）。</p>'}`}</div>`;

  html += `<div class="card"><div class="card-h"><h2>食事・睡眠</h2></div>
    ${lifeW.length ? `<dl class="kv"><dt>記録した日</dt><dd>${lifeW.length}日</dd><dt>平均睡眠</dt><dd>${sleepW.length ? esc(fmtHM(avg(sleepW))) : '記録なし'}${sleepW.length && sleepP.length ? `（前週 ${esc(fmtHM(avg(sleepP)))}）` : ''}</dd>
      <dt>6時間未満の日</dt><dd>${sleepW.length ? sleepW.filter(m => m < 360).length + '日' : '記録なし'}</dd>
      <dt>朝食を食べた日</dt><dd>${lifeW.filter(l => l.meals.breakfast.ate).length}日</dd>
      <dt>野菜「しっかり」</dt><dd>${lifeW.some(l => l.veg) ? lifeW.filter(l => l.veg === 'しっかり').length + '日' : '記録なし'}</dd>
      <dt>甘いもの「多め」</dt><dd>${lifeW.some(l => l.sweets) ? lifeW.filter(l => l.sweets === '多め').length + '日' : '記録なし'}</dd><dt>食事の内容</dt><dd>${esc(tagSummary(lifeW))}</dd>
      <dt>運動</dt><dd>${(() => { const e = lifeW.filter(l => l.exRecorded); return e.length ? `${e.filter(l => exTotal(l) > 0).length}日・合計 ${esc(fmtMin(e.reduce((a, l) => a + exTotal(l), 0)))}` : '記録なし'; })()}</dd>
      <dt>平均歩数</dt><dd>${(() => { const st = lifeW.filter(l => l.steps != null).map(l => l.steps); return st.length ? Math.round(avg(st)).toLocaleString() + '歩' : '記録なし'; })()}</dd>
      <dt>栄養（目安・1日平均）</dt><dd>${(() => { const n = lifeW.filter(l => l.foods.length); if (!n.length) return '記録なし'; const tt = n.map(l => nutTotals(l.foods)); const a = k => avg(tt.map(x => x[k])); return esc(nutLine({kcal:a('kcal'), p:a('p'), f:a('f'), c:a('c'), veg:a('veg')})) + `<div class="small muted">${n.length}日分の記録から計算した概算です</div>`; })()}</dd></dl>`
      : '<p class="small muted">記録なし</p>'}</div>`;

  html += `<div class="card"><div class="card-h"><h2>化粧品への支出</h2></div><div class="big-stat">${yen(spent)}</div>
    ${buys.length ? `<table class="table" style="margin-top:10px"><tbody>${buys.map(b => `<tr><td>${esc(b.name)}<div class="small muted">${fmtShort(b.date)}</div></td><td class="r">${yen(b.price)}</td></tr>`).join('')}</tbody></table>` : '<p class="small muted" style="margin-top:6px">この週の購入記録はありません。</p>'}</div>`;

  // 翌週に確認するとよいポイント（ルールに基づく）
  const pts = [];
  if (s.n < 4 && daysElapsed >= 4) pts.push(`この週の肌の記録は${s.n}日でした。週4日以上記録すると、変化を比べやすくなります。`);
  if (started.length) pts.push(`「${started.map(x => x.name).join('」「')}」の使用を開始しました。新しい商品を同時にいくつも増やさず、1つずつ試すと記録を見比べやすくなります。`);
  if (started.length >= 2) pts.push('この週に2つ以上の商品を使い始めています。肌に変化があっても、どの商品によるものかを区別しにくくなります。');

  if (used.length && !logs.some(l => l.usageRecorded)) pts.push('「今日使った化粧品」を記録すると、予定と実際の使用頻度を比べられます。');
  if (s.acneAvg != null && p.acneAvg != null && s.acneAvg - p.acneAvg >= 0.5) pts.push('ニキビの記録数が前週より増えています。「ニキビの詳細」で部位・大きさ・経過を記録しておくと、振り返りやすくなります。');
  if (s.dry != null && s.dry >= 3) pts.push('乾燥の自己評価が高めでした。室内の湿度や洗顔の回数など、商品以外の状況もメモしておきましょう。');
  if (s.red != null && s.red >= 3) pts.push('赤みの自己評価が高めでした。赤みが続く・悪化する場合は、自己判断せず皮膚科医に相談してください。');
  if (sleepW.length && sleepW.filter(m => m < 360).length >= 3) pts.push('睡眠が6時間未満の日が3日以上ありました。睡眠と肌の記録を引き続き並べて見てみましょう。');
  if (!lifeW.length) pts.push('食事・睡眠の記録がありません。就寝・起床時刻だけでも記録すると、肌記録と並べて振り返れます。');
  const areaCount = {};
  logs.forEach(l => l.areas.forEach(a => areaCount[a] = (areaCount[a] || 0) + 1));
  const topArea = Object.entries(areaCount).sort((a,b) => b[1] - a[1])[0];
  if (topArea && topArea[1] >= 2) pts.push(`「${areaName(topArea[0])}」が気になる部位として最も多く（${topArea[1]}日）記録されました。来週も同じ部位の様子を記録しておきましょう。`);
  if (!pts.length) pts.push('記録を続けましょう。同じ時間帯（例：夜の洗顔後）に記録すると、日ごとの比較がしやすくなります。');
  html += `<div class="card"><div class="card-h"><h2>翌週に確認するとよいポイント</h2><span class="chip">ルールに基づく表示</span></div><ul class="points">${pts.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  return html;
}

/* =========================================================
   アカウント・有料プラン（Supabase でログイン、Stripe で決済）
   ・肌の記録などのデータは、これまでどおり端末の中だけに保存します
   ・サーバーにあるのは「メールアドレス」と「契約状況」だけです
   ・有料機能の本当の判定は、サーバー側（AIの関数）で行います。画面の判定は表示用です
   ========================================================= */
const acct = {status:'idle', client:null, user:null, sub:null, subLoaded:false, price:null, priceErr:'', busy:false, mode:'login', confirm:false, recovery:false, msg:'', polling:false};
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.async = true; el.onload = res; el.onerror = () => rej(new Error('load')); document.head.appendChild(el); });
}
function hasSavedLogin() { try { return !!localStorage.getItem(CLOUD.storageKey); } catch (e) { return false; } }
function rerenderAcct() { const n = parseRoute().name; if (n === 'plan' || n === 'settings') render(); else if (n === 'account') { refreshAccPanel('plan'); refreshAccPanel('settings'); } else if (n === 'home') refreshAdvice(); }
async function initCloud() {
  if (acct.status === 'loading' || acct.status === 'ready') return;
  acct.status = 'loading'; rerenderAcct();
  try {
    if (!window.supabase) await loadScript(CLOUD.sdk);
    acct.client = window.supabase.createClient(CLOUD.url, CLOUD.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:CLOUD.storageKey}});
    acct.client.auth.onAuthStateChange((event, session) => {
      const before = acct.user && acct.user.id;
      acct.user = session ? session.user : null;
      if (event === 'PASSWORD_RECOVERY') { acct.recovery = true; location.hash = '#/plan'; }
      if ((acct.user && acct.user.id) !== before) { acct.sub = null; acct.subLoaded = false; setTimeout(refreshSub, 0); }
    });
    const {data} = await acct.client.auth.getSession();
    acct.user = data && data.session ? data.session.user : null;
    acct.status = 'ready';
    await refreshSub();
  } catch (e) { acct.status = 'error'; rerenderAcct(); }
}
async function refreshSub() {
  if (!acct.client || !acct.user) { acct.sub = null; acct.subLoaded = true; rerenderAcct(); return; }
  try {
    const {data, error} = await acct.client.from('subscriptions').select('*').eq('user_id', acct.user.id).maybeSingle();
    if (!error) acct.sub = data || null;
  } catch (e) { /* 読み込めなくても画面は動かす */ }
  acct.subLoaded = true; rerenderAcct();
}
function isPremium() {
  const s = acct.sub;
  return !!(acct.user && s && ['active','trialing'].includes(s.status) && (!s.current_period_end || new Date(s.current_period_end) > new Date()));
}
// 写真読み取り（プレミアム）：写真をサーバーの関数「vision」に送り、AIの推定結果を受け取る
async function callVision(mode, image, payload) {
  if (!acct.client) await initCloud();
  if (!acct.client || !acct.user) throw new Error('ログインしてからお使いください。');
  // 返事が来ないまま「読み取り中」で止まらないように、90秒で打ち切る
  const call = acct.client.functions.invoke('vision', {body:mode === 'advice' ? {mode, data:payload} : mode === 'diag' ? {mode} : {mode, image}});
  const {data, error} = await Promise.race([call, new Promise((_, rej) => setTimeout(() => rej(new Error('時間がかかりすぎたため中止しました。電波のよい場所で、もう一度お試しください。')), 90000))]);
  if (error) {
    let msg = 'サーバーに接続できませんでした。時間をおいてお試しください。';
    try {
      const st = error.context && error.context.status, j = await error.context.json();
      if (j && (j.error || j.message || j.msg)) msg = String(j.error || j.message || j.msg);
      if (/JWT/i.test(msg)) msg = 'サーバーの設定で、ログインの確認方法が合っていません（Verify JWT）。' + (st ? `［${st}］` : '');
    } catch (e) { /* 何もしない */ }
    if (mode !== 'diag') msg += '（うまくいかないときは「プラン・アカウント」の画面の「診断する」で原因を調べられます）';
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}
// ---------- 写真読み取り・AI分析がうまく動かないときの診断 ----------
let diagRes = null, diagBusy = false;
function diagCardHtml() {
  let body = '<p class="small muted" style="margin:0">写真読み取りやAI分析がうまく動かないときに、サーバーの設定のどこに問題があるかを調べます（回数には数えません）。</p>';

function diagResultHtml(r) {
  if (r.error) return `<div class="notice warn" style="margin:10px 0 0"><b>診断できませんでした</b><br>${esc(r.error)}${r.fix ? `<br><b>直し方：</b>${esc(r.fix)}` : ''}</div>`;
  const d = r.diag, rows = [];
  const row = (ok, label, detail, fix) => rows.push(`<li class="${ok ? 'ok' : 'ng'}"><span>${ok ? '✓' : '✕'}</span><div><b>${esc(label)}</b>${detail ? `<small>${esc(detail)}</small>` : ''}${!ok && fix ? `<em>直し方：${esc(fix)}</em>` : ''}</div></li>`);
  row(d.version === VISION_VERSION, 'サーバーの関数「vision」が最新', `版：${d.version || '不明'}`, '5_関数_vision.txt を Supabase の vision に貼り付けて「Deploy updates」を押してください。');
  row(true, 'ログイン', d.email);
  row(d.premium, 'プレミアムの契約', typeof d.subscription === 'object' && d.subscription ? `状態：${d.subscription.status}` : String(d.subscription || ''), 'プラン・アカウントの画面から申し込んでください（テスト中はテスト用カードで申し込めます）。');
  row(d.quotaTable, '回数を数える表（vision_usage）', d.quotaError || '', '6_写真読み取り_SQL.txt を Supabase の「SQL Editor」に貼り付けて「Run」を押してください。');

async function handleAuthSubmit(form) {
  const v = n => form.elements[n] ? String(form.elements[n].value).trim() : '';
  const signup = acct.mode === 'signup', errors = {};
  const email = v('email'), password = form.elements.password.value;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = 'メールアドレスを正しく入力してください。';
  if (!password) errors.password = 'パスワードを入力してください。';
  else if (signup && (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password))) errors.password = '8文字以上で、英字と数字を組み合わせてください。';
  if (signup && form.elements.password2.value !== password) errors.password2 = 'パスワードが一致しません。';
  if (signup && !form.elements.agree.checked) errors.agree = '同意のチェックを入れてください。';
  if (!showErrors(form, errors)) return;
  acct.busy = true; acct.msg = ''; render();
  try {
    if (signup) {
      const {data, error} = await acct.client.auth.signUp({email, password, options:{emailRedirectTo:appUrl()}});
      if (error) throw error;
      if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('already registered');
      if (!data.session) { acct.mode = 'login'; acct.msg = `${email} に確認のメールを送りました。メール内のリンクを押して登録を完了してから、ログインしてください。メールが届かない場合は、迷惑メールのフォルダも確認してください。`; }
    } else {
      const {error} = await acct.client.auth.signInWithPassword({email, password});
      if (error) throw error;
      toast('ログインしました');
    }
  } catch (e) { toast(authErrMsg(e), 'error'); }
  acct.busy = false; render();
}
async function handlePwSubmit(form) {
  const p1 = form.elements.pw1.value, p2 = form.elements.pw2.value, errors = {};
  if (p1.length < 8 || !/[A-Za-z]/.test(p1) || !/\d/.test(p1)) errors.pw1 = '8文字以上で、英字と数字を組み合わせてください。';
  if (p1 !== p2) errors.pw2 = 'パスワードが一致しません。';
  if (!showErrors(form, errors)) return;
  acct.busy = true; render();
  try { const {error} = await acct.client.auth.updateUser({password:p1}); if (error) throw error; acct.recovery = false; toast('パスワードを変更しました'); }
  catch (e) { toast(authErrMsg(e), 'error'); }
  acct.busy = false; render();
}

/* ---------- デモデータ ---------- */
function addDemo() {
  const t = todayStr();
  let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const pf = (k, meal, qty = 1) => { const f = FOOD_DB.find(x => x.k === k); return {id:uid(), meal, name:f.n, qty, kcal:f.kcal, p:f.p, f:f.f, c:f.c, veg:f.veg}; };
  const mk = (catId, name, cat, purposes, timing, freq, start, status, end, buys, memo) => ({id:uid(), catalogId:getCat(catId) ? catId : '', name, brand:'サンプルブランド', category:cat, purposes, ingredients:'', timing, frequency:freq,
    startDate:addDays(t, -start), status, endDate:end != null ? addDays(t, -end) : '', memo:memo || 'デモデータ', demo:true,
    purchases:buys.map(([d, pr]) => ({id:uid(), date:addDays(t, -d), price:pr, memo:''}))});
  const P = [
    mk('sample-1','【サンプル】低刺激ジェル洗顔','洗顔',['洗浄'],'朝・夜','毎日',45,'使用中',null,[[45,1200]]),
    mk('sample-2','【サンプル】保湿トナー ヒアルロン酸配合','化粧水・トナー',['保湿'],'朝・夜','毎日',38,'使用中',null,[[38,1800],[4,1800]]),
    mk('sample-3','【サンプル】ツボクサエキス アンプル','美容液・アンプル',['鎮静・肌あれ対策'],'夜','毎日',12,'使用中',null,[[12,2400]]),
    mk('sample-7','【サンプル】レチノール ナイトセラム','美容液・アンプル',['ハリ・エイジングケア'],'夜','週2〜3回',9,'使用中',null,[[9,3200]]),
    mk('sample-8','【サンプル】AHA 角質ケアトナー','化粧水・トナー',['角質ケア'],'夜','週2〜3回',20,'使用中',null,[[20,1900]]),
    mk('sample-4','【サンプル】セラミド バリアクリーム','クリーム',['保湿'],'夜','週4〜6回',55,'使用終了',21,[[55,2800]],'デモデータ：しっとりしていて冬向き'),
    mk('sample-6','【サンプル】ナイアシンアミド セラム','美容液・アンプル',['皮脂・毛穴ケア'],'朝','毎日',3,STOCK,null,[[3,2200]])
  ];
  state.myProducts.push(...P);
  const usedIds = P.filter(p => p.status === '使用中');
  const existing = new Set(state.skinLogs.map(l => l.date)), existingLife = new Set(state.lifeLogs.map(l => l.date));
  for (let i = 27; i >= 0; i--) {
    const date = addDays(t, -i);
    if (i % 6 !== 4 && !existing.has(date)) {
      const cond = clamp(Math.round(3 + Math.sin(i / 4) + (rnd() - 0.5) * 1.4), 1, 5);
      const areas = AREAS.filter(() => rnd() < 0.3).map(a => a.id);
      const spots = areas.length && rnd() < 0.6 ? areas.slice(0, 2).map(a => ({id:uid(), area:a, count:1 + Math.floor(rnd() * 3), type:rnd() < 0.5 ? '赤ニキビ' : '白ニキビ', size:ACNE_SIZES[Math.floor(rnd() * 2)], status:ACNE_STATUS[Math.floor(rnd() * 4)], onset:''})) : [];
      const acne = spots.length ? spots.reduce((a, s) => a + s.count, 0) : clamp(Math.round(2 + Math.cos(i / 5) * 1.5 + (rnd() - 0.5) * 2), 0, 99);
      // レチノールは予定どおり、角質ケアトナーは予定より多めに使った想定（使用頻度チェックの確認用）
      const used = usedIds.filter(p => p.startDate <= date && (p.frequency === '毎日' || rnd() < (p.catalogId === 'sample-8' ? 0.6 : 0.33))).map(p => p.id);
      state.skinLogs.push({id:uid(), date, condition:cond, acneCount:acne, acneTypes:acne > 2 ? ['赤ニキビ'] : acne > 0 ? ['白ニキビ'] : [], acneSpots:spots,
        redness:clamp(Math.round(2 + Math.sin(i / 3) + (rnd() - 0.5)), 0, 5), dryness:clamp(Math.round(2 + Math.cos(i / 6) * 1.5 + (rnd() - 0.5)), 0, 5),
        oil:clamp(Math.round(2 + (rnd() - 0.5) * 2), 0, 5), otherConcerns:rnd() < 0.2 ? ['ざらつき'] : [], areas, usedProducts:used, usageRecorded:true, memo:'デモデータ', photo:null, demo:true});
    }
    if (i % 5 !== 2 && !existingLife.has(date)) {
      const bedH = 23 + Math.floor(rnd() * 3), bedM = Math.floor(rnd() * 4) * 15, sleepH = 5 + rnd() * 3;
      const bm = (bedH * 60 + bedM) % 1440, wm = (bm + Math.round(sleepH * 60)) % 1440;
      const hm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
      state.lifeLogs.push({id:uid(), date, bed:hm(bm), wake:hm(wm), meals:{breakfast:{ate:rnd() < 0.7, time:''}, lunch:{ate:true, time:'12:30'}, dinner:{ate:true, time:'19:30'}},
        veg:AMOUNT3[Math.floor(rnd() * 3)], protein:AMOUNT3[Math.floor(rnd() * 2)], sweets:SWEETS[Math.floor(rnd() * 3)], water:WATER[Math.floor(rnd() * 3)], tags:FOOD_TAGS.filter(() => rnd() < 0.2),
        foods:rnd() < 0.7 ? [pf(rnd() < 0.5 ? 'bread' : 'rice', 'breakfast'), pf('conbini_bento', 'lunch'), pf('rice', 'dinner'), pf(rnd() < 0.5 ? 'salmon' : 'chicken_breast', 'dinner'), pf('miso', 'dinner')].concat(rnd() < 0.5 ? [pf('salad', 'dinner')] : [], rnd() < 0.4 ? [pf('choco', 'snack')] : []) : [],
        mealPhotos:{}, exercise:rnd() < 0.5 ? [{type:EX_TYPES[Math.floor(rnd() * 4)], minutes:15 + Math.floor(rnd() * 4) * 15}] : [], exRecorded:true, steps:3000 + Math.floor(rnd() * 8000),
        memo:'デモデータ', demo:true});
    }
  }
  if (save()) { toast('デモデータを追加しました'); render(); }
}

  e.preventDefault();
  const form = e.target, v = parseYen(form.elements.budget.value);
  if (isNaN(v)) { showErrors(form, {budget:'0以上の整数（半角数字）で入力してください。'}); return; }
  showErrors(form, {});
  state.settings.monthlyBudget = v === '' ? 0 : v;
  if (save()) toast('予算を保存しました');
});

/* =========================================================
   画面の切り替え（ルーティング）
   ========================================================= */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const qi = h.indexOf('?');
  const path = qi >= 0 ? h.slice(0, qi) : h, qs = qi >= 0 ? h.slice(qi + 1) : '';
  const [name, ...rest] = path.split('/');
  let query = {};
  try { query = Object.fromEntries(new URLSearchParams(qs)); } catch (e) { query = {}; }
  return {name:name || 'home', id:rest.length ? decodeURIComponent(rest.join('/')) : '', query};
}
function renderNav(active, sideActive) {
  let g = null, side = ''; sideActive = sideActive || active;
  NAV.forEach(n => { if (n.g !== g) { g = n.g; if (g) side += `<div class="sn-group">${esc(g)}</div>`; } side += `<a class="sn-item ${sideActive === n.r ? 'active' : ''}" href="#/${n.r}">${icon(n.icon)}${esc(n.label)}</a>`; });
  $('#side-nav').innerHTML = side;
  const moreActive = !BOTTOM_NAV.includes(active);
  $('#bottom-nav').innerHTML = BOTTOM_NAV.map(r => r === 'account' ? {r:'account', label:'アカウント', icon:'user'} : NAV.find(n => n.r === r)).map(n => `<a class="bn-item ${active === n.r ? 'active' : ''}" href="#/${n.r}">${icon(n.icon)}<span>${esc(n.r === 'search' ? '商品検索' : n.label)}</span></a>`).join('');
  const tm = document.getElementById('top-menu'); if (tm) tm.classList.toggle('on', moreActive);
}
let lastRoute = '';
// スクロールの勢いが残ったまま別の画面に移ると、iPhoneでは画面が止まったように見えるため、勢いを止めてから一番上に戻す
function stopMomentumTop() {
  const de = document.documentElement;
  de.style.overflow = 'hidden'; window.scrollTo(0, 0);
  requestAnimationFrame(() => { de.style.overflow = ''; window.scrollTo(0, 0); });
}
// 左上：ホームでは「肌トモ」、肌の記録・マイ化粧品・商品検索・アカウントでは、その画面の名前を出す
function setTopTitle(t) {
  const tb = $('.topbar'); if (!tb) return;
  const cur = tb.firstElementChild, want = t || '肌トモ';
  if (cur && cur.dataset.t === want) return;
  const html = t ? `<h1 class="wordmark top-title" data-t="${esc(t)}">${esc(t)}</h1>` : `<a class="wordmark" data-t="肌トモ" href="#/home">肌トモ<small>最小限で最大限を</small></a>`;
  if (cur && cur.classList.contains('wordmark')) cur.outerHTML = html; else tb.insertAdjacentHTML('afterbegin', html);
  const el = tb.firstElementChild; if (cur) { el.classList.add('tt-in'); }
}
function render() {
  const r = parseRoute();
  const views = {home:viewHome, search:viewSearch, product:() => viewProduct(r.id), prices:() => viewPrices(r.id), stores:viewStores,
    ingredients:() => viewIngredients(r.id), scan:viewScan, my:() => r.id ? viewMyDetail(r.id) : viewMy(), compare:viewCompare, combo:viewCombo,
    log:viewLog, charts:viewCharts, report:viewReport, spending:viewSpending, check:() => viewCheck(r.id), settings:viewSettings, account:viewAccount, favorites:viewFavorites, terms:viewTerms, privacy:viewPrivacy, law:viewLaw, plan:() => viewPlan(r.query), suggest:viewSuggest, visit:viewVisit};
  const alias = {account:'account', product:'search', prices:'search', stores:'search', favorites:'search', spending:'account', plan:'account', settings:'account', compare:'charts', check:'account', terms:'account', privacy:'account', law:'account'};
  const navName = alias[r.name] || (views[r.name] ? r.name : 'home');
  if (r.name !== 'check') ui._checkFrom = '';
  if (r.name === 'plan' && acct.status === 'idle') setTimeout(initCloud, 0);
  if (r.name !== 'stores') { ui.geo = null; ui.storeRes = null; ui.storeCands = []; ui.geoHelp = ''; }
  if (r.name !== 'scan') ui.scan = scanInit(); // 登録しなかった写真は、画面を離れたら破棄
  chartDefs = [];
  let html;
  try { html = (views[r.name] || viewHome)(); }
  catch (err) { console.error(err); html = `<div class="card">${emptyBox('note', '画面の表示中にエラーが発生しました', 'ページを再読み込みしてください。解決しない場合は、設定からバックアップを書き出したうえで「すべて削除」をお試しください。', '<a class="btn btn-primary btn-sm" href="#/settings">設定を開く</a>')}</div>`; }
  // ホーム以外の画面には、上に「戻る」を付ける（その画面に専用の戻るリンクがある場合は付けない）
  if (r.name !== 'home' && !(['log', 'my', 'search', 'stores', 'favorites', 'account'].includes(r.name) && !r.id) && !/^\s*(<div class="notice[^>]*>.*?<\/div>\s*)?<a class="back"/s.test(html)) html = `<button type="button" class="back back-btn" data-action="go-back">← 戻る</button>` + html;
  // 「← ○○」リンク：来た画面がリンク先と違うときは「← 戻る」と表示して、来た画面に戻る
  const prevNav = navStack.length > 1 ? navStack[navStack.length - 2] : '';
  html = html.replace(/<a class="back" href="([^"]*)">([^<]*)<\/a>/g, (m, href, label) => `<a class="back" href="${href}" data-back="1">${prevNav && prevNav !== href ? '← 戻る' : label}</a>`);
  renderingNow = true; try { $('#main').innerHTML = html; } finally { renderingNow = false; } // 作り直しの最中に古い入力欄から来る変更は無視する
  renderNav(navName, ({product:'search', prices:'search', compare:'charts', check:'spending', terms:'settings', privacy:'settings', law:'settings'})[r.name] || r.name);
  setTopTitle(r.id ? '' : ({log:'肌の記録', my:'マイ化粧品', search:'商品検索', favorites:'商品検索', stores:'商品検索', account:'アカウント'})[r.name] || '');
  const key = r.name + '/' + r.id;
  const routeChanged = key !== lastRoute;
  if (key !== lastRoute) {
    lastRoute = key;
    if (navRestoreY != null) { const y = navRestoreY; window.scrollTo(0, y); requestAnimationFrame(() => { window.scrollTo(0, y); setTimeout(() => { if (Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y); }, 120); }); }
    else stopMomentumTop();
  }
  navRestoreY = null;
  drawCharts();
  if (routeChanged) motionIn(r.name + (r.id ? '/' + r.id : '')); // 画面を移ったときだけ、動きのある表示にする
  fillAds();
  if (r.name === 'charts') drawFace3d();
  else if (r.name === 'log' && document.getElementById('face3d-log')) { const list = logDayList(), d = logFaceData(list[logDayIdx(list)]); bindLogDaySwipe(); drawFace3d({canvas:'face3d-log', load:'ld-load', tip:'', camZ:55, yawOnly:true, grid:true, gridLines:false, ready:st => { st.canvasId = 'face3d-log'; face3dShowLog(st, d); }}); }
  else if (r.name === 'home' && document.getElementById('face3d-home')) { const hd = homeFaceData(); drawFace3d({canvas:'face3d-home', load:'t3-load', tip:'t3-tip', camZ:55, yawOnly:true, grid:true, gridLines:false, unit:hd.mode === 'spots' ? '個' : 'flag', ready:st => face3dShowLog(st, hd)}); if (isPremium()) runAdvice(false); }
  else if (FACE3D.st) { FACE3D.st.stop = true; FACE3D.st = null; }
  if (r.name === 'stores') drawStoreMap(); else if (storeMap) { try { storeMap.remove(); } catch (e) {} storeMap = null; }
}
// ほかのタブ・ウィンドウで記録を変えたとき、この画面にも反映する（古い内容で上書きしないため）
window.addEventListener('storage', e => {
  if (e.key !== STORE_KEY || !e.newValue) return;
  try { state = normalize(JSON.parse(e.newValue)); } catch (err) { return; }
  if (!$('#modal-root').innerHTML) render();
  toast('別のタブでの変更を反映しました');
});
// 画面を移った順番を覚えておく（「戻る」で、来た画面に正しく戻る。行ったり来たりのループを防ぐ）
// 一度通った画面にもう一度来たときは、そこまで巻き戻す
const navKey = () => { const h = location.hash || '#/home'; return h === '#' || h === '#/' ? '#/home' : h; };
const navStack = [navKey()];
// 画面ごとのスクロール位置（戻ったときに、元の位置に戻す）
const navScroll = {};
let navRestoreY = null;
window.addEventListener('scroll', () => { if (lockedY != null) return; navScroll[navStack[navStack.length - 1]] = window.scrollY; }, {passive:true}); // メニューなどを開いて画面を固定している間は記録しない
window.addEventListener('hashchange', () => {
  const k = navKey(), i = navStack.lastIndexOf(k);
  navRestoreY = i >= 0 && navScroll[k] != null ? navScroll[k] : null; // 来たことのある画面へ戻るときだけ、位置を戻す
  if (i >= 0) navStack.length = i + 1; else { navStack.push(k); navScroll[k] = 0; }
  if (navStack.length > 50) navStack.splice(0, navStack.length - 50);
});
function goBack(fallback) {
  if (navStack.length > 1) { const to = navStack[navStack.length - 2]; location.hash = to; }
  else location.hash = fallback || '#/home';
}
// 画面にある「← ○○」の戻るリンクも、来た画面に戻る（来た画面がなければ、リンク先へ）
document.addEventListener('click', e => {
  const a = e.target.closest('a.back[data-back]'); if (!a) return;
  e.preventDefault(); goBack(a.getAttribute('href'));
});
window.addEventListener('hashchange', () => { if ($('#modal-root').innerHTML) closeModal(); render(); });
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 150); });
$('#top-menu').innerHTML = '<span class="hb" aria-hidden="true"><i></i><i></i><i></i></span>'; $('#top-menu').setAttribute('aria-expanded', 'false');
if (researchState() && researchState().on) setTimeout(() => { if (researchState().lastSent !== todayStr()) researchSend(); }, 5000); // 研究に協力中なら、1日1回まで統計を新しくする
if (hasSavedLogin()) setTimeout(initCloud, 0); // 以前ログインしていた場合だけ、ログイン状態を確認する
document.title = `${SERVICE}｜最小限で最大限を`;
render();
</script>
