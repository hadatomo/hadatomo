/* =========================================================
   アカウント・有料プラン（Supabase でログイン、Stripe で決済）
   ・肌の記録などのデータは、これまでどおり端末の中だけに保存します
   ・サーバーにあるのは「メールアドレス」と「契約状況」だけです
   ・有料機能の本当の判定は、サーバー側（AIの関数）で行います。画面の判定は表示用です
   ========================================================= */
const acct = {status:'idle', client:null, user:null, sub:null, subLoaded:false, price:null, priceErr:'', busy:false, mode:'login', confirm:false, recovery:false, msg:'', polling:false};
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.async = true; el.onload = res; el.onerror = () => rej(new Error('load')); document.head.appendChild(el); });
}
function hasSavedLogin() { try { return !!localStorage.getItem(CLOUD.storageKey); } catch (e) { return false; } }
function rerenderAcct() { const n = parseRoute().name; if (n === 'plan' || n === 'settings') render(); else if (n === 'account') { refreshAccPanel('plan'); refreshAccPanel('settings'); } else if (n === 'home') refreshAdvice(); }
// ===== クラウド保存（ログインして「クラウドに保存する」をオンにした人だけ） =====
// 記録・化粧品・設定をSupabaseに保存し、機種変更やブラウザのデータ削除のあとでも続きから使えるようにする
// 写真（肌写真・化粧品の写真）はクラウドに送らない（この端末の中だけ）
const SYNC = {busy:false, timer:null, at:'', err:'', pending:false};
const SYNC_ARRAYS = ['catalog', 'myProducts', 'skinLogs', 'lifeLogs', 'customFoods'];
const isDataImg = v => typeof v === 'string' && v.startsWith('data:');
function syncPayload() {
  const d = JSON.parse(JSON.stringify(state));
  SYNC_ARRAYS.forEach(k => (d[k] || []).forEach(x => Object.keys(x).forEach(f => { if (isDataImg(x[f])) x[f] = null; })));
  if (d.settings) { delete d.settings.wxLoc; delete d.settings.wxPlace; } // 今いる場所はクラウドに送らない（端末の中だけ）
  return d;
}
// クラウドのデータを使うとき、この端末にだけある写真は残す
function syncKeepPhotos(remote) {
  SYNC_ARRAYS.forEach(k => { const loc = new Map((state[k] || []).map(x => [x.id, x]));
    (remote[k] || []).forEach(x => { const l = loc.get(x.id); if (l) Object.keys(l).forEach(f => { if (isDataImg(l[f]) && !x[f]) x[f] = l[f]; }); }); });
  return remote;
}
const syncOn = () => !!(state.settings.cloudSync && acct.client && acct.user);
const hasRecords = s => !!(s && ((s.skinLogs || []).some(l => !l.demo) || (s.lifeLogs || []).some(l => !l.demo) || (s.myProducts || []).some(p => !p.isSample)));
function syncSoon() { if (!syncOn()) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(syncPush, 2500); }
async function syncPush() {
  if (!syncOn()) return;
  if (SYNC.busy) { SYNC.pending = true; return; }
  SYNC.busy = true; SYNC.err = '';
  try {
    const now = new Date().toISOString();
    const {error} = await acct.client.from('user_data').upsert({user_id:acct.user.id, data:syncPayload(), updated_at:now});
    if (error) throw error;
    SYNC.at = now; try { localStorage.setItem('nakakaramo_sync_at', now); } catch (e) {}
  } catch (e) { SYNC.err = 'クラウドに保存できませんでした（電波のよい場所で自動でやり直します）'; }
  SYNC.busy = false; syncPaint();
  if (SYNC.pending) { SYNC.pending = false; syncSoon(); }
}
// 起動・ログインのとき：クラウドのほうが新しければ、この端末のデータを置き換える（写真は残す）
async function syncPull(ask) {
  if (!syncOn()) return;
  try {
    const {data, error} = await acct.client.from('user_data').select('data, updated_at').eq('user_id', acct.user.id).maybeSingle();
    if (error) throw error;
    if (!data) { syncPush(); return; } // まだクラウドに何もない → この端末のデータを保存
    const last = (() => { try { return localStorage.getItem('nakakaramo_sync_at') || ''; } catch (e) { return ''; } })();
    const localNewer = (state.savedAt || 0) > Date.parse(last || 0) + 1000; // 最後にクラウドに保存したあと、この端末で変更した
    if (data.updated_at <= last && localNewer) { syncPush(); return; }
    if (data.updated_at <= last) return; // 同じ
    if (ask && hasRecords(state) && localNewer) { syncAsk(data); return; } // 両方に新しい記録がある → どちらを使うか聞く
    syncApply(data);
  } catch (e) { SYNC.err = 'クラウドのデータを読み込めませんでした'; syncPaint(); }
}
function syncApply(row) {
  const keepSync = state.settings.cloudSync, keepLoc = state.settings.wxLoc, keepPlace = state.settings.wxPlace;
  state = normalize(syncKeepPhotos(row.data || {})); state.settings.cloudSync = keepSync; state.settings.wxLoc = keepLoc; state.settings.wxPlace = keepPlace;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); localStorage.setItem('nakakaramo_sync_at', row.updated_at); } catch (e) {}
  SYNC.at = row.updated_at; toast('クラウドのデータを読み込みました'); render();
}
function syncAsk(row) {
  ui.syncRow = row;
  openModal({title:'どちらのデータを使いますか？', body:`<p class="small" style="margin:0 0 8px">この端末とクラウドの両方に、新しい記録があります。</p>
    <ul class="points small"><li><b>クラウド</b>：${esc(fmtShort(row.updated_at.slice(0, 10)))}に保存したデータ</li><li><b>この端末</b>：いま表示しているデータ</li></ul>
    <p class="small muted">選ばなかったほうのデータは上書きされます。写真はどちらを選んでもこの端末に残ります。</p>`,
    footer:`<button type="button" class="btn btn-ghost" data-action="sync-use-local">この端末</button><button type="button" class="btn btn-primary" data-action="sync-use-cloud">クラウド</button>`});
}
function syncPaint() { const b = document.getElementById('sync-card'); if (b) b.outerHTML = syncCardHtml(); }
function syncCardHtml() {
  const st = state.settings, on = !!st.cloudSync;
  const status = !acct.user ? '<p class="small muted" style="margin:8px 0 0">使うには、先に<a href="#/plan">ログイン</a>してください（無料）。</p>'
    : on ? `<p class="small" style="margin:8px 0 0;color:${SYNC.err ? 'var(--warn)' : 'var(--green-d)'}">${SYNC.err ? esc(SYNC.err) : SYNC.busy ? 'クラウドに保存しています…' : SYNC.at ? `クラウドに保存済み（${esc(new Date(SYNC.at).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}))}）` : 'オン'}</p>` : '';
  return `<div class="card" id="sync-card"><div class="card-h"><h2>クラウドに保存</h2></div>
    <p class="small muted" style="margin:0 0 10px">オンにすると、記録・化粧品・設定をあなたのアカウントに保存します。機種変更したときや、ブラウザのデータが消えたときも、ログインすれば続きから使えます。<b>写真はクラウドに送らず、この端末の中だけ</b>に保存します。</p>
    <label class="check"><input type="checkbox" id="f_cloudSync" ${on ? 'checked' : ''} ${acct.user ? '' : 'disabled'}> クラウドに保存する</label>${status}</div>`;
}
async function initCloud() {
  if (acct.status === 'loading' || acct.status === 'ready') return;
  acct.status = 'loading'; rerenderAcct();
  try {
    if (!window.supabase) await loadScript(CLOUD.sdk);
    acct.client = window.supabase.createClient(CLOUD.url, CLOUD.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:CLOUD.storageKey}});
    acct.client.auth.onAuthStateChange((event, session) => {
      const before = acct.user && acct.user.id;
      acct.user = session ? session.user : null;
      if (event === 'PASSWORD_RECOVERY') { acct.recovery = true; location.hash = '#/plan'; }
      if ((acct.user && acct.user.id) !== before) { acct.sub = null; acct.subLoaded = false; setTimeout(refreshSub, 0); if (acct.user) setTimeout(() => syncPull(true), 0); }
    });
    const {data} = await acct.client.auth.getSession();
    acct.user = data && data.session ? data.session.user : null;
    acct.status = 'ready';
    if (acct.user) syncPull(true);
    await refreshSub();
  } catch (e) { acct.status = 'error'; rerenderAcct(); }

async function handleAuthSubmit(form) {
  const v = n => form.elements[n] ? String(form.elements[n].value).trim() : '';
  const signup = acct.mode === 'signup', errors = {};
  const email = v('email'), password = form.elements.password.value;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = 'メールアドレスを正しく入力してください。';
  if (!password) errors.password = 'パスワードを入力してください。';
  else if (signup && (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password))) errors.password = '8文字以上で、英字と数字を組み合わせてください。';
  if (signup && form.elements.password2.value !== password) errors.password2 = 'パスワードが一致しません。';
  if (signup && !form.elements.agree.checked) errors.agree = '同意のチェックを入れてください。';
  if (!showErrors(form, errors)) return;
  acct.busy = true; acct.msg = ''; render();
  const lim = (pr) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('fetch timeout')), 20000))]); // 20秒たっても返事がなければ、ボタンを押せる状態に戻す
  try {
    if (!acct.client) { await initCloud(); if (!acct.client) throw new Error('fetch failed'); }
    if (signup) {
      const {data, error} = await lim(acct.client.auth.signUp({email, password, options:{emailRedirectTo:appUrl()}}));
      if (error) throw error;
      if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('already registered');
      if (!data.session) { acct.mode = 'login'; acct.msg = `${email} に確認のメールを送りました。メール内のリンクを押して登録を完了してから、ログインしてください。メールが届かない場合は、迷惑メールのフォルダも確認してください。`; }
    } else {
      const {error} = await lim(acct.client.auth.signInWithPassword({email, password}));
      if (error) throw error;
      toast('ログインしました');
    }
  } catch (e) { toast(authErrMsg(e), 'error'); }
  acct.busy = false; render();
}
async function handlePwSubmit(form) {
  const p1 = form.elements.pw1.value, p2 = form.elements.pw2.value, errors = {};
  if (p1.length < 8 || !/[A-Za-z]/.test(p1) || !/\d/.test(p1)) errors.pw1 = '8文字以上で、英字と数字を組み合わせてください。';
  if (p1 !== p2) errors.pw2 = 'パスワードが一致しません。';
  if (!showErrors(form, errors)) return;
  acct.busy = true; render();
  try { const {error} = await acct.client.auth.updateUser({password:p1}); if (error) throw error; acct.recovery = false; toast('パスワードを変更しました'); }
  catch (e) { toast(authErrMsg(e), 'error'); }
  acct.busy = false; render();
}

/* ---------- デモデータ ---------- */
function addDemo() {
  const t = todayStr();
  let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const pf = (k, meal, qty = 1) => { const f = FOOD_DB.find(x => x.k === k); return {id:uid(), meal, name:f.n, qty, kcal:f.kcal, p:f.p, f:f.f, c:f.c, veg:f.veg}; };
  const mk = (catId, name, cat, purposes, timing, freq, start, status, end, buys, memo) => ({id:uid(), catalogId:getCat(catId) ? catId : '', name, brand:'サンプルブランド', category:cat, purposes, ingredients:'', timing, frequency:freq,
    startDate:addDays(t, -start), status, endDate:end != null ? addDays(t, -end) : '', memo:memo || 'デモデータ', demo:true,
    purchases:buys.map(([d, pr]) => ({id:uid(), date:addDays(t, -d), price:pr, memo:''}))});
  const P = [
    mk('sample-1','【サンプル】低刺激ジェル洗顔','洗顔',['洗浄'],'朝・夜','毎日',45,'使用中',null,[[45,1200]]),
    mk('sample-2','【サンプル】保湿トナー ヒアルロン酸配合','化粧水・トナー',['保湿'],'朝・夜','毎日',38,'使用中',null,[[38,1800],[4,1800]]),
    mk('sample-3','【サンプル】ツボクサエキス アンプル','美容液・アンプル',['鎮静・肌あれ対策'],'夜','毎日',12,'使用中',null,[[12,2400]]),
    mk('sample-7','【サンプル】レチノール ナイトセラム','美容液・アンプル',['ハリ・エイジングケア'],'夜','週2〜3回',9,'使用中',null,[[9,3200]]),
    mk('sample-8','【サンプル】AHA 角質ケアトナー','化粧水・トナー',['角質ケア'],'夜','週2〜3回',20,'使用中',null,[[20,1900]]),
    mk('sample-4','【サンプル】セラミド バリアクリーム','クリーム',['保湿'],'夜','週4〜6回',55,'使用終了',21,[[55,2800]],'デモデータ：しっとりしていて冬向き'),
    mk('sample-6','【サンプル】ナイアシンアミド セラム','美容液・アンプル',['皮脂・毛穴ケア'],'朝','毎日',3,STOCK,null,[[3,2200]])
  ];
  // 架空の商品はMyアイテムに入れない（実際にある商品だけを扱うため）。デモは肌・食事・睡眠の記録だけ
  P.length = 0;
  const usedIds = [];
  const existing = new Set(state.skinLogs.map(l => l.date)), existingLife = new Set(state.lifeLogs.map(l => l.date));
  for (let i = 27; i >= 0; i--) {
    const date = addDays(t, -i);
    if (i % 6 !== 4 && !existing.has(date)) {
      const cond = clamp(Math.round(3 + Math.sin(i / 4) + (rnd() - 0.5) * 1.4), 1, 5);
      const areas = AREAS.filter(() => rnd() < 0.3).map(a => a.id);
      const spots = areas.length && rnd() < 0.6 ? areas.slice(0, 2).map(a => ({id:uid(), area:a, count:1 + Math.floor(rnd() * 3), type:rnd() < 0.5 ? '赤ニキビ' : '白ニキビ', size:ACNE_SIZES[Math.floor(rnd() * 2)], status:ACNE_STATUS[Math.floor(rnd() * 4)], onset:''})) : [];
      const acne = spots.length ? spots.reduce((a, s) => a + s.count, 0) : clamp(Math.round(2 + Math.cos(i / 5) * 1.5 + (rnd() - 0.5) * 2), 0, 99);
      // レチノールは予定どおり、角質ケアトナーは予定より多めに使った想定（使用頻度チェックの確認用）
      const used = usedIds.filter(p => p.startDate <= date && (p.frequency === '毎日' || rnd() < (p.catalogId === 'sample-8' ? 0.6 : 0.33))).map(p => p.id);
      state.skinLogs.push({id:uid(), date, condition:cond, acneCount:acne, acneTypes:acne > 2 ? ['赤ニキビ'] : acne > 0 ? ['白ニキビ'] : [], acneSpots:spots,
        redness:clamp(Math.round(2 + Math.sin(i / 3) + (rnd() - 0.5)), 0, 5), dryness:clamp(Math.round(2 + Math.cos(i / 6) * 1.5 + (rnd() - 0.5)), 0, 5),
        oil:clamp(Math.round(2 + (rnd() - 0.5) * 2), 0, 5), otherConcerns:rnd() < 0.2 ? ['ざらつき'] : [], areas, usedProducts:used, usageRecorded:true, memo:'デモデータ', photo:null, demo:true});
    }
    if (i % 5 !== 2 && !existingLife.has(date)) {
      const bedH = 23 + Math.floor(rnd() * 3), bedM = Math.floor(rnd() * 4) * 15, sleepH = 5 + rnd() * 3;
      const bm = (bedH * 60 + bedM) % 1440, wm = (bm + Math.round(sleepH * 60)) % 1440;
      const hm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
      state.lifeLogs.push({id:uid(), date, bed:hm(bm), wake:hm(wm), meals:{breakfast:{ate:rnd() < 0.7, time:''}, lunch:{ate:true, time:'12:30'}, dinner:{ate:true, time:'19:30'}},
        veg:AMOUNT3[Math.floor(rnd() * 3)], protein:AMOUNT3[Math.floor(rnd() * 2)], sweets:SWEETS[Math.floor(rnd() * 3)], water:WATER[Math.floor(rnd() * 3)], tags:FOOD_TAGS.filter(() => rnd() < 0.2),
        foods:rnd() < 0.7 ? [pf(rnd() < 0.5 ? 'bread' : 'rice', 'breakfast'), pf('conbini_bento', 'lunch'), pf('rice', 'dinner'), pf(rnd() < 0.5 ? 'salmon' : 'chicken_breast', 'dinner'), pf('miso', 'dinner')].concat(rnd() < 0.5 ? [pf('salad', 'dinner')] : [], rnd() < 0.4 ? [pf('choco', 'snack')] : []) : [],
        mealPhotos:{}, exercise:rnd() < 0.5 ? [{type:EX_TYPES[Math.floor(rnd() * 4)], minutes:15 + Math.floor(rnd() * 4) * 15}] : [], exRecorded:true, steps:3000 + Math.floor(rnd() * 8000),
        memo:'デモデータ', demo:true});
    }
  }
  if (save()) { toast('デモデータを追加しました'); render(); }
}

// ---------- 下に引っぱって更新（Pull-to-Refresh）----------
// 引っぱって離すと、データを読み直して今の画面を描き直す（ページは移動しない）
async function ptrRefresh(noRender) {
  const tasks = [];
  // ① 保存してある記録を読み直す（ほかのタブで入力した分・ヘルスケア連携で入った分など）
  try { state = load(); } catch (e) { /* 読めなくても今のデータのまま */ }
  // ② ログインしていれば、プラン（プレミアム）の状態をサーバーから取り直す
  if (acct.client && acct.user) tasks.push(refreshSub()); else if (hasSavedLogin()) tasks.push(initCloud());
  // ③ アプリの新しい版が出ていないか確かめる（あれば、次に開いたときに新しくなる）
  try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) tasks.push(navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {})); } catch (e) { /* 何もしない */ }

  if (ui.net && ui.net.q && parseRoute().name === 'search') { const q = ui.net.q; ui.net = null; tasks.push(netSearch(q)); }
  await Promise.race([Promise.allSettled(tasks), new Promise(r => setTimeout(r, 8000))]); // 電波が悪くても8秒で終える
  if (!noRender) ptrRepaint();

// 新しいデータで今の画面を描き直す（指が画面に触れている間は描き直さない：触れている部分が消えると、指を離したことが伝わらなくなるため）
function ptrRepaint() {
  render();

}
// 状態を4つに分けて管理する：idle（ふだん）→ pulling（引っぱり中）→ refreshing（更新中：画面の位置を保つ）→ settling（更新後に元へ戻る）
// 画面の動きは、CSSのトランジションではなく、毎フレーム自分で位置を計算して動かす（iPhoneでも途中で飛ばないように）
// 決まった距離まで引っぱった時点で（指を離すのを待たずに）更新を始める。iPhoneの標準アプリと同じ動き
(function pullToRefresh() {
  const page = document.getElementById('page'), ptr = document.getElementById('ptr'); if (!page || !ptr) return;
  const arc = ptr.querySelector('.ptr-arc'), svg = ptr.querySelector('svg');
  const MAX = 170, GO = 78, HOLD = 60; // 引っぱれる最大・更新が始まる距離・更新中に保つ位置（px）
  const canVibrate = typeof navigator.vibrate === 'function';
  let ptrX0 = 0, phase = 'idle', y0 = null, started = false, d = 0, raf = 0, touching = false, done = false, tickLater = false;
  const setY = v => { d = v; page.style.transform = v > 0.25 ? `translate3d(0,${v.toFixed(2)}px,0)` : ''; };
  const drawPull = () => { // 引っぱった量に合わせて、輪が伸びて回る
    const k = Math.min(1, d / GO);
    ptr.style.opacity = String(Math.min(1, d / (GO * 0.55)));
    arc.setAttribute('stroke-dashoffset', String(56.5 * (1 - k * 0.82)));
    svg.style.transform = `rotate(${(d * 2.6).toFixed(1)}deg)`;
  };
  // ゴムのように：はじめは指とほぼ同じだけ動き、引っぱるほど少しずつ重くなる（途中で止まらない）
  const rubber = dy => MAX * (1 - Math.exp(-dy / 260));
  const animate = (to, ms, ease, onStep, fin) => {
    cancelAnimationFrame(raf); const from = d, t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / ms), e = ease(k); setY(from + (to - from) * e); if (onStep) onStep(e); if (k < 1) raf = requestAnimationFrame(step); else { setY(to); if (fin) fin(); } };
    raf = requestAnimationFrame(step);
  };
  const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
  const easeSettle = k => 1 - Math.pow(1 - k, 4); // Safariの戻り方に近い：はじめは速く、最後はなめらかに減速
  const blocked = t => $('#modal-root').innerHTML || $('#confirm-root').innerHTML || document.body.classList.contains('no-scroll') || document.querySelector('.fp-big,.f3-full') || (t && t.closest && t.closest('input,textarea,select,.ld-cal,.home-tabs'));
  const settle = () => { // settling：くるくるを消してから、画面を元の位置へ戻す
    phase = 'settling'; ptr.classList.add('fade');
    setTimeout(() => animate(0, 480, easeSettle, null, () => { ptr.classList.remove('spin', 'fade'); ptr.style.opacity = '0'; svg.style.transform = ''; phase = 'idle'; }), 160);
  };
  const startRefresh = () => { // refreshing：更新を始める（指はまだ画面の上でもよい）
    phase = 'refreshing'; done = false;
    ptr.style.opacity = '1'; svg.style.transform = ''; arc.setAttribute('stroke-dashoffset', String(56.5 * 0.72)); ptr.classList.add('spin');
    if (canVibrate) hapticTick(); else tickLater = true; // iPhoneは指を離した瞬間でないと鳴らせないので、離したときに鳴らす
    const t0 = performance.now();

  };

    y0 = e.touches[0].clientY; ptrX0 = e.touches[0].clientX; started = false;
  }, {passive:true});
  window.addEventListener('touchmove', e => {
    if (y0 == null || (phase !== 'idle' && phase !== 'pulling' && !(phase === 'refreshing' && touching))) return;
    const dy = e.touches[0].clientY - y0;
    if (!started) {
      // 一番上で、下向きに動かし始めた最初の1回から引き受ける（ブラウザのスクロールに取られて途中で止まらないように）
      if (dy <= 0 || window.scrollY > 0) { if (dy < 0) y0 = null; return; }
      if (Math.abs(e.touches[0].clientX - ptrX0) > dy) { y0 = null; return; } // 横向きのスワイプ（ホームのタブ切り替え）は、更新にしない
      started = true; touching = true; phase = 'pulling'; window.__ptrOn = true; ptr.classList.remove('spin', 'fade');
    }
    e.preventDefault();
    setY(dy > 0 ? rubber(dy) : 0);
    if (phase === 'pulling') { drawPull(); if (d >= GO) startRefresh(); }
  }, {passive:false});
  const end = () => {
    if (y0 == null) return; y0 = null;
    window.__ptrOn = false;
    if (!started) return; touching = false;
    if (tickLater) { tickLater = false; hapticTick(); } // 更新が始まっていれば、指を離したこの瞬間に「カチッ」
    if (phase === 'refreshing') {
      // 指を離しても戻さず、更新中の位置で止めておく。更新がもう終わっていれば、そのあとで戻す

    } else if (phase === 'pulling') {

      phase = 'settling';
      animate(0, 380, easeSettle, () => drawPull(), () => { ptr.style.opacity = '0'; phase = 'idle'; });

})();
// 一番下まで来たあとも、さらに上へ少し引っぱれる（ゴムのように伸びて、離すとなめらかに戻る）
(function bottomBounce() {
  const page = document.getElementById('page'); if (!page) return;
  let y0 = null, on = false, d = 0, raf = 0;
  const atBottom = () => window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
  // 上にくっついているタブのバー（今日の記録・おすすめケア…）は、ページといっしょに動かさない（iPhoneでバーだけずれて動くのを防ぐ）

    d = v; const on2 = v > 0.25;
    page.style.transform = on2 ? `translate3d(0,${(-v).toFixed(2)}px,0)` : '';
    if (bar) bar.forEach(el => { el.style.transform = on2 ? `translate3d(0,${v.toFixed(2)}px,0)` : ''; });
    if (!on2) bar = null;
  };
  const blocked = t => $('#modal-root').innerHTML || $('#confirm-root').innerHTML || document.body.classList.contains('no-scroll') || document.querySelector('.fp-big,.f3-full') || (t && t.closest && t.closest('input,textarea,select,canvas'));

    if (y0 == null) return;

      const tb = document.querySelector('.home-tabs'); bar = tb && tb.getBoundingClientRect().top <= 1 ? [tb] : null; return; } // 上の帯はいつも、タブのバーは上にくっついているときだけ、ページといっしょに動かさない // バーが上にくっついている（止まっている）ときだけ
    if (dy <= 0) { setY(0); return; }

  const end = () => {
    if (!on) { y0 = null; return; } on = false; y0 = null;
    const from = d, t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 420), e = 1 - Math.pow(1 - k, 4); setY(from * (1 - e)); if (k < 1) raf = requestAnimationFrame(step); else setY(0); };
    raf = requestAnimationFrame(step);
  };
  window.addEventListener('touchend', end); window.addEventListener('touchcancel', end);
})();
